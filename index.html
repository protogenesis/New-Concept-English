<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Your complete, offline New Concept English reading library. Four books, one quiet place to read.">
  <title>NCE Reader · New Concept English</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f5; --sidebar: #f0eee7; --surface: #fffefb;
      --ink: #292e27; --muted: #73766b; --line: #dedfd4;
      --accent: #49634d; --accent-soft: #e3e9dd; --accent-ink: #334e38;
      --gold: #ac8c54; --shadow: 0 20px 80px #1b291b26;
      --reading-size: 20px; --sidebar-width: 300px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #20241f; --sidebar: #1a1e19; --surface: #282d26;
      --ink: #e8e8dd; --muted: #a3aa99; --line: #3c4437;
      --accent: #b7c7a7; --accent-soft: #33422e; --accent-ink: #d0dfbe;
      --gold: #c3a979; --shadow: 0 20px 80px #0006;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-padding-top: 24px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; color: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button, .button { min-height: 44px; }
    button:disabled { cursor: default; opacity: .4; }
    a { color: var(--accent); text-underline-offset: 4px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    svg { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .skip-link { position: fixed; top: 8px; left: 16px; z-index: 20; padding: 12px; background: var(--surface); transform: translateY(-200%); }
    .skip-link:focus { transform: none; }
    .library { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid var(--line); z-index: 10; }
    .library-top { padding: 30px 24px 0; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { display: grid; place-items: center; width: 42px; height: 46px; border-radius: 4px 11px 11px 4px; background: var(--accent); color: var(--paper); box-shadow: inset 4px 0 #ffffff25; }
    .brand-icon svg { width: 25px; height: 25px; }
    .brand-name { font-family: Georgia, "Times New Roman", serif; font-size: 24px; letter-spacing: -.7px; line-height: 1.1; }
    .brand-caption { margin: 4px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 44px; padding: 8px 12px; border: 1px solid transparent; background: transparent; border-radius: 7px; }
    .icon-button:hover { background: var(--accent-soft); }
    .close-library { margin-left: auto; display: none; }
    .search { display: flex; align-items: center; gap: 8px; margin: 28px 0 22px; padding: 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
    .search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .search svg { color: var(--muted); width: 17px; }
    .search input { width: 100%; min-width: 0; min-height: 46px; padding: 10px 0; border: 0; outline: none; background: transparent; font-size: 16px; }
    .search input::placeholder { color: var(--muted); font-size: 13px; }
    .clear-search { padding: 0; min-width: 44px; border: 0; background: transparent; font-size: 22px; color: var(--muted); }
    .section-label { margin: 0 0 10px; color: var(--muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.9px; }
    .books { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .book-button { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; text-align: left; }
    .book-button[aria-pressed="true"] { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
    .book-number { font: 24px/1 Georgia, serif; }
    .book-label { display: block; font-size: 12px; font-weight: 600; }
    .book-count { display: block; color: var(--muted); font-size: 10px; }
    .contents-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 25px 0 12px; gap: 8px; }
    .contents-heading .section-label { margin: 0; }
    #list-count { color: var(--muted); font-size: 11px; }
    .lesson-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 0 12px 20px; scroll-padding: 8px; }
    .lesson-link { display: flex; align-items: baseline; gap: 12px; min-height: 46px; padding: 12px; color: var(--muted); text-decoration: none; border-radius: 5px; line-height: 1.4; margin-bottom: 2px; }
    .lesson-link:hover { background: var(--accent-soft); color: var(--ink); }
    .lesson-link[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }
    .lesson-number { font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 2px; opacity: .8; flex: 0 0 25px; }
    .lesson-name { min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
    .search-result { display: block; }
    .result-context { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; letter-spacing: .7px; }
    .search-result .lesson-name { display: block; color: var(--ink); font-weight: 500; }
    .result-excerpt { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
    mark { background: var(--accent-soft); color: var(--accent-ink); padding: 0 1px; }
    .empty-results { padding: 18px 12px; color: var(--muted); font-size: 13px; }
    .library-bottom { padding: 15px 24px max(18px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .offline-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 1px; }
    .library-summary { margin-top: 4px; opacity: .85; }
    .main-shell { margin-left: var(--sidebar-width); min-width: 0; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; min-height: 90px; padding: 16px 46px; border-bottom: 1px solid var(--line); }
    .breadcrumb { color: var(--muted); font-size: 12px; display: flex; flex: 1; align-items: center; flex-wrap: wrap; gap: 12px; }
    .breadcrumb .slash { opacity: .4; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    .font-controls { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; }
    .font-controls .icon-button { min-width: 44px; border: 0; padding: 6px 10px; }
    #font-smaller { font: 17px Georgia, serif; }
    #font-larger { font: 22px Georgia, serif; }
    #font-value { width: 34px; text-align: center; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .theme-toggle { border-color: var(--line); }
    .theme-label { font-size: 12px; }
    .menu-button { border-color: var(--line); font-size: 12px; }
    .reading-wrap { max-width: 850px; padding: 48px 54px 32px; margin: 0 auto; }
    .book-intro { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 24px; margin-bottom: 46px; border-bottom: 1px solid var(--line); }
    .book-kicker { color: var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: 2.3px; font-weight: 600; }
    #book-subtitle { font: italic 18px/1.5 Georgia, serif; color: var(--muted); margin: 4px 0 0; }
    #article-count { font-size: 11px; color: var(--muted); text-align: right; }
    .article-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; }
    .article-meta .meta-dot { color: var(--gold); }
    h1 { margin: 15px 0 30px; font: 400 clamp(36px, 4.7vw, 56px)/1.12 Georgia, "Times New Roman", serif; letter-spacing: -1.4px; overflow-wrap: anywhere; }
    h1:focus { outline: none; }
    .article-rule { width: 38px; height: 2px; background: var(--gold); margin-bottom: 32px; }
    .article-body { font: var(--reading-size)/1.85 Georgia, "Times New Roman", serif; letter-spacing: .005em; overflow-wrap: anywhere; }
    .article-body p { margin: 0 0 .9em; white-space: pre-wrap; }
    .article-body .original-heading { color: var(--muted); font-size: .78em; margin-bottom: 1.5em; }
    .article-body .listening-prompt { padding-left: 18px; border-left: 2px solid var(--line); color: var(--muted); font-size: .88em; font-style: italic; margin-bottom: 1.5em; }
    .article-end { display: flex; align-items: center; gap: 12px; margin: 42px 0 28px; color: var(--gold); }
    .article-end::before, .article-end::after { content: ""; display: block; height: 1px; flex: 1; background: var(--line); }
    .article-end svg { width: 17px; height: 17px; }
    .article-pagination { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .page-button { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 0; padding: 16px 18px; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 7px; }
    .page-button:hover:enabled { border-color: var(--accent); background: var(--accent-soft); }
    .page-button:last-child { text-align: right; align-items: flex-end; }
    .page-direction { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
    .page-title { font: 16px/1.4 Georgia, serif; overflow-wrap: anywhere; max-width: 100%; }
    .reader-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-top: 26px; color: var(--muted); font-size: 11px; }
    .reading-progress { position: fixed; top: 0; right: 0; left: var(--sidebar-width); height: 2px; z-index: 5; pointer-events: none; }
    #progress-fill { height: 100%; width: 0; background: var(--accent); opacity: .65; }
    .backdrop { position: fixed; inset: 0; z-index: 9; background: #11190f66; backdrop-filter: blur(2px); }
    .sidebar-hidden .library { visibility: hidden; transform: translateX(-100%); }
    .sidebar-hidden .main-shell { margin-left: 0; }
    .sidebar-hidden .reading-progress { left: 0; }
    @media (min-width: 769px) and (max-width: 1050px) {
      :root { --sidebar-width: 260px; }
      .library-top { padding-left: 18px; padding-right: 18px; }
      .reading-wrap { padding-left: 32px; padding-right: 32px; }
      .topbar { padding-left: 28px; padding-right: 28px; }
    }
    @media (max-width: 768px) {
      .library { width: min(360px, calc(100% - 24px)); padding-left: env(safe-area-inset-left); visibility: hidden; transform: translateX(-100%); border: 0; box-shadow: var(--shadow); }
      .library.is-open { transform: none; visibility: visible; }
      .library-top { padding-top: max(20px, env(safe-area-inset-top)); }
      .close-library { display: inline-flex; }
      .main-shell { margin-left: 0; }
      .topbar { min-height: 76px; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 14px max(18px, env(safe-area-inset-left)); }
      .breadcrumb { display: none; }
      .toolbar { gap: 6px; }
      .theme-label { display: none; }
      .theme-toggle { padding: 8px; }
      .reading-wrap { padding: 28px max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
      .book-intro { padding-bottom: 20px; margin-bottom: 32px; gap: 12px; }
      #book-subtitle { font-size: 16px; }
      #article-count { font-size: 10px; flex-shrink: 0; }
      h1 { font-size: clamp(36px, 8vw, 52px); margin-bottom: 24px; }
      .article-body { line-height: 1.8; }
      .reading-progress { left: 0; }
      .page-button { padding: 14px 12px; }
      .page-title { font-size: 15px; }
      .reader-footer { padding-top: 18px; }
    }
    @media (max-width: 359px) {
      .topbar { padding-left: 14px; padding-right: 14px; gap: 6px; }
      .menu-button { padding: 8px; gap: 5px; }
      .toolbar { gap: 4px; }
      #font-value { width: 28px; }
      .reading-wrap { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
      .article-pagination { gap: 8px; }
    }
    @media (max-height: 560px) {
      .library { display: block; overflow-y: auto; overscroll-behavior: contain; }
      .library-top { padding-top: max(16px, env(safe-area-inset-top)); }
      .lesson-list { overflow: visible; }
    }
    @media print {
      .library, .topbar, .reading-progress, .article-pagination, .reader-footer, .backdrop { display: none !important; }
      .main-shell { margin: 0; }
      .reading-wrap { max-width: none; padding: 0; }
      .article-body { font-size: 12pt; }
      body { background: white; color: black; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#article-title">Skip to article</a>

  <noscript><p style="padding:24px">Please enable JavaScript to browse the articles in this offline reader.</p></noscript>
  <script id="reader-data" type="application/json">{"books":[{"number":1,"title":"New Concept English 1","subtitle":"First Things First","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/","lessons":[{"id":"book-1-lesson-1","bookNumber":1,"number":1,"title":"Excuse me","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-001-excuse-me-44988325/","text":"Lesson 1. Excuse me.\n\nListen to the tape, then answer this question. Whose handbag is it?\n\nExcuse me. Yes? Is this your handbag? Pardon?\n\nIs this your handbag? Yes, it is. Thank you very much."},{"id":"book-1-lesson-3","bookNumber":1,"number":3,"title":"Sorry, sir","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-003-sorry-sir-44988329/","text":"Lesson 3. Sorry, sir.\n\nListen to the tape, then answer this question. Does the man get his umbrella back?\n\nMy coat and my umbrella, please. Here is my ticket. Thank you, sir. Number 5.\n\nHere's your umbrella and your coat. This is not my umbrella. Sorry, sir. Is this your umbrella?\n\nNo, it isn't. Is this it? Yes, it is. Thank you very much."},{"id":"book-1-lesson-5","bookNumber":1,"number":5,"title":"Nice to meet you","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-005-nice-to-meet-you-44988328/","text":"Lesson 5. Nice to meet you.\n\nListen to the tape, then answer this question. Is Chang-woo Chinese?\n\nGood morning. Good morning, Mr. Blake. This is Miss Sophie Dupont. Sophie is a new student.\n\nShe is French. Sophie, this is Hans. He is German. Nice to meet you.\n\nAnd this is Naoko. She's Japanese. Nice to meet you. And this is Chang-woo.\n\nHe's Korean. Nice to meet you. And this is Luming. He's Chinese.\n\nNice to meet you. And this is Xiaohui. She's Chinese, too. Nice to meet you."},{"id":"book-1-lesson-7","bookNumber":1,"number":7,"title":"Are you a teacher?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-007-are-you-a-teacher-44988332/","text":"Lesson 7. Are you a teacher?\n\nListen to the tape, then answer this question. What is Robert's job?\n\nI am a new student. My name's Robert. Nice to meet you. My name's Sophie.\n\nAre you French? Yes, I am. Are you French, too? No, I am not.\n\nWhat nationality are you? I'm Italian. Are you a teacher? No, I'm not.\n\nWhat's your job? I'm a keyboard operator. What's your job? I'm an engineer."},{"id":"book-1-lesson-9","bookNumber":1,"number":9,"title":"How are you today?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-009-how-are-you-today-44988339/","text":"Lesson 9. How are you today?\n\nListen to the tape, then answer this question. How is Emma?\n\nHello, Helen. Hi, Steven. How are you today? I'm very well, thank you.\n\nAnd you? I'm fine, thanks. How is Tony? He's fine, thanks.\n\nHow's Emma? She's very well, too, Helen. Goodbye, Helen. Nice to see you.\n\nNice to see you, too, Steven. Goodbye."},{"id":"book-1-lesson-11","bookNumber":1,"number":11,"title":"Is this your shirt?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-011-is-this-your-shirt-44988336/","text":"Lesson 11. Is this your shirt?\n\nListen to the tape, then answer this question. Whose shirt is white?\n\nWhose shirt is that? Is this your shirt, Dave? No, sir. It's not my shirt.\n\nThis is my shirt. My shirt's blue. Is this shirt Tim's? Perhaps it is, sir.\n\nTim's shirt's white. Tim? Yes, sir? Is this your shirt?\n\nYes, sir. Here you are. Catch! Thank you, sir."},{"id":"book-1-lesson-13","bookNumber":1,"number":13,"title":"A new dress","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-013-a-new-dress-44988338/","text":"Lesson 13. A new dress.\n\nListen to the tape, then answer this question. What colour is Anna's hat?\n\nWhat colour is your new dress? It's green. Come upstairs and see it. Thank you.\n\nLook! Here it is. That's a nice dress. It's very smart.\n\nMy hat's new too. What colour is it? It's the same colour. It's green too.\n\nThat is a lovely hat."},{"id":"book-1-lesson-15","bookNumber":1,"number":15,"title":"Your passports, please","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-015-your-passports-please-44988342/","text":"Lesson 15. Your passports, please.\n\nListen to the tape, then answer this question. Is there a problem with the customs officer?\n\nAre you Swedish? No, we are not. We are Danish. Are your friends Danish too?\n\nNo, they aren't. They are Norwegian. Your passports, please. Here they are.\n\nAre these your cases? No, they aren't. Our cases are brown. Here they are.\n\nAre you tourists? Yes, we are. Are your friends tourists too? Yes, they are.\n\nThat's fine. Thank you very much."},{"id":"book-1-lesson-17","bookNumber":1,"number":17,"title":"How do you do?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-017-how-do-you-do-44988343/","text":"Lesson 17. How do you do?\n\nListen to the tape, then answer this question. What are Michael Baker and Jeremy Short's jobs?\n\nCome and meet our employees, Mr. Richards. Thank you, Mr. Jackson. This is Nicola Grey. And this is Claire Taylor.\n\nHow do you do? Those women are very hard-working. What are their jobs? They're keyboard operators.\n\nThis is Michael Baker. And this is Jeremy Short. How do you do? They aren't very busy.\n\nWhat are their jobs? They're sales reps. They're very lazy. Who is this young man?\n\nThis is Jim. He's our office assistant."},{"id":"book-1-lesson-19","bookNumber":1,"number":19,"title":"Tired and thirsty","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-019-tired-and-thirsty-44988346/","text":"Lesson 19. Tired and thirsty.\n\nListen to the tape, then answer this question. Why do the children thank their mother?\n\nWhat's the matter, children? We're tired. And thirsty, Mum. Sit down here.\n\nAre you all right now? No, we aren't. Look! There's an ice cream man.\n\nTwo ice creams, please. Here you are, children. Thanks, Mum. These ice creams are nice.\n\nAre you all right now? Yes, we are. Thank you."},{"id":"book-1-lesson-21","bookNumber":1,"number":21,"title":"Which book?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-021-which-book-44988348/","text":"Lesson 21. Which book?\n\nListen to the tape, then answer this question. Which book does the man want?\n\nGive me a book, please, Jane. Which book? This one? No, not that one.\n\nThe red one. This one? Yes, please. Here you are.\n\nThank you."},{"id":"book-1-lesson-23","bookNumber":1,"number":23,"title":"Which glasses?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-023-which-glasses-44988347/","text":"Lesson 23. Which glasses?\n\nListen to the tape, then answer this question. Which glasses does the man want?\n\nGive me some glasses, please, Jane. Which glasses? These glasses? No, not those.\n\nThe ones on the shelf. These? Yes, please. Here you are.\n\nThanks."},{"id":"book-1-lesson-25","bookNumber":1,"number":25,"title":"Mrs. Smith's kitchen","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-025-mrs-smiths-kitchen-44988352/","text":"Lesson 25. Mrs. Smith's kitchen.\n\nListen to the tape, then answer this question. What colour is the electric cooker?\n\nMrs. Smith's kitchen is small. There is a refrigerator in the kitchen. The refrigerator is white. It is on the right.\n\nThere is an electric cooker in the kitchen. The cooker is blue. It is on the left. There is a table in the middle of the room.\n\nThere is a bottle on the table. The bottle is empty. There is a cup on the table, too. The cup is clean."},{"id":"book-1-lesson-27","bookNumber":1,"number":27,"title":"Mrs. Smith's living room","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-027-mrs-smiths-living-room-44988349/","text":"Lesson 27. Mrs. Smith's living room.\n\nListen to the tape, then answer this question. Where are the books?\n\nMrs. Smith's living room is large. There is a television in the room. The television is near the window. There are some magazines on the television.\n\nThere is a table in the room. There are some newspapers on the table. There are some armchairs in the room. The armchairs are near the table.\n\nThere is a stereo in the room. The stereo is near the door. There are some books on the stereo. There are some pictures in the room.\n\nThe pictures are on the wall."},{"id":"book-1-lesson-29","bookNumber":1,"number":29,"title":"Come in, Amy","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-029-come-in-amy-44988351/","text":"Lesson 29. Come in, Amy.\n\nListen to the tape, then answer this question. How must Amy clean the floor?\n\nCome in, Amy. Shut the door, please. This bedroom's very untidy. What must I do, Mrs. Jones?\n\nOpen the window and air the room. Then put these clothes in the wardrobe. Then make the bed. Dust the dressing table.\n\nThen sweep the floor."},{"id":"book-1-lesson-31","bookNumber":1,"number":31,"title":"Where's Sally?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-031-wheres-sally-44988354/","text":"Lesson 31. Where's Sally?\n\nListen to the tape, then answer this question. Is the cat climbing the tree?\n\nWhere's Sally, Jack? She's in the garden, Jane. What's she doing? She's sitting under the tree.\n\nIs Tim in the garden too? Yes, he is. He's climbing the tree. I beg your pardon?\n\nWho's climbing the tree? Tim is. What about the dog? The dog's in the garden too.\n\nIt's running across the grass. It's running after a cat."},{"id":"book-1-lesson-33","bookNumber":1,"number":33,"title":"A Fine Day","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-033-a-fine-day-44988353/","text":"Lesson 33. A Fine Day.\n\nListen to the tape, then answer this question. Where is the Jones family?\n\nIt is a fine day today. There are some clouds in the sky, but the sun is shining. Mr. Jones is with his family. They are walking over the bridge.\n\nThere are some boats on the river. Mr. Jones and his wife are looking at them. Sally is looking at a big ship. The ship is going under the bridge.\n\nTim is looking at an aeroplane. The aeroplane is flying over the river."},{"id":"book-1-lesson-35","bookNumber":1,"number":35,"title":"Our village","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-035-our-village-44988356/","text":"Lesson 35. Our village.\n\nListen to the tape, then answer this question. Are the children coming out of the park or going into it?\n\nThis is a photograph of our village. Our village is in a valley. It is between two hills. The village is on a river.\n\nHere is another photograph of the village. My wife and I are walking along the banks of the river. We are on the left. There is a boy in the water.\n\nHe is swimming across the river. Here is another photograph. This is the school building. It is beside a park.\n\nThe park is on the right. Some children are coming out of the building. Some of them are going into the park."},{"id":"book-1-lesson-37","bookNumber":1,"number":37,"title":"Making a bookcase","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-037-making-a-bookcase-44988360/","text":"Lesson 37. Making a bookcase.\n\nListen to the tape, then answer this question. What is Susan's favorite colour?\n\nYou're working hard, George. What are you doing? I'm making a bookcase. Give me that hammer, please, Dan.\n\nWhich hammer? This one? No, not that one. The big one.\n\nHere you are. Thanks, Dan. What are you going to do now, George? I'm going to paint it.\n\nWhat colour are you going to paint it? I'm going to paint it pink. Pink? This bookcase isn't for me.\n\nIt's for my daughter, Susan. Pink's her favorite colour."},{"id":"book-1-lesson-39","bookNumber":1,"number":39,"title":"Don't drop it!","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-039-dont-drop-it-44988361/","text":"Lesson 39. Don't drop it!\n\nListen to the tape, then answer this question. Where does Sam put the vase in the end?\n\nWhat are you going to do with that vase, Penny? I'm going to put it on this table, Sam. Don't do that. Give it to me.\n\nWhat are you going to do with it? I'm going to put it here, in front of the window. Be careful! Don't drop it!\n\nDon't put it there, Sam. Put it here, on this shelf. There we are. It's a lovely vase.\n\nThose flowers are lovely, too."},{"id":"book-1-lesson-41","bookNumber":1,"number":41,"title":"Penny's bag","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-041-pennys-bag-44988362/","text":"Lesson 41. Penny's bag.\n\nListen to the tape, then answer this question. Who is the tin of tobacco for?\n\nIs that bag heavy, Penny? Not very. Here, put it on this chair. What's in it?\n\nA piece of cheese, a loaf of bread, a bar of soap, a bar of chocolate, a bottle of milk, a pound of sugar, half a pound of coffee, a quarter of a pound of tea, and a tin of tobacco. Is that tin of tobacco for me? Well, it's certainly not for me."},{"id":"book-1-lesson-43","bookNumber":1,"number":43,"title":"Hurry up!","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-043-hurry-up-44988364/","text":"Lesson 43. Hurry up!\n\nListen to the tape, then answer this question. How do you know Sam doesn't make the tea very often?\n\nCan you make the tea, Sam? Yes, of course I can, Penny. Is there any water in this kettle? Yes, there is.\n\nWhere's the tea? It's over there, behind the teapot. Can you see it? I can see the teapot, but I can't see the tea.\n\nThere it is! It's in front of you! Oh, yes! I can see it now.\n\nWhere are the cups? There are some in the cupboard. Can you find them? Yes, here they are.\n\nHurry up, Sam! The kettle's boiling!"},{"id":"book-1-lesson-45","bookNumber":1,"number":45,"title":"The Boss's Letter","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-045-the-bosss-letter-44988370/","text":"Lesson 45. The Boss's Letter.\n\nListen to the tape, then answer this question. Why can't Pamela type the letter?\n\nCan you come here a minute, please, Bob? Yes, sir. Where's Pamela? She's next door.\n\nShe's in her office, sir. Can she type this letter for me? Ask her, please. Yes, sir.\n\nCan you type this letter for the boss, please, Pamela? Yes, of course I can. Here you are. Thank you, Bob.\n\nBob? Yes? What's the matter? I can't type this letter.\n\nI can't read it. The boss's handwriting is terrible."},{"id":"book-1-lesson-47","bookNumber":1,"number":47,"title":"A cup of coffee","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-047-a-cup-of-coffee-44988366/","text":"Lesson 47. A cup of coffee.\n\nListen to the tape, then answer this question. How does Ann like her coffee?\n\nDo you like coffee, Ann? Yes, I do. Do you want a cup? Yes, please, Christine.\n\nDo you want any sugar? Yes, please. Do you want any milk? No, thank you.\n\nI don't like milk in my coffee. I like black coffee. Do you like biscuits? Yes, I do.\n\nDo you want one? Yes, please."},{"id":"book-1-lesson-49","bookNumber":1,"number":49,"title":"At the butcher's","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-049-at-the-butchers-44988368/","text":"Lesson 49. At the butcher's.\n\nListen to the tape, then answer this question. What does Mr. Bird like?\n\nDo you want any meat today, Mrs. Bird? Yes, please. Do you want beef or lamb? Beef, please.\n\nThis lamb's very good. I like lamb, but my husband doesn't. What about some steak? This is a nice piece.\n\nGive me that piece, please. And a pound of mince, too. Do you want a chicken, Mrs. Bird? They're very nice.\n\nNo, thank you. My husband likes steak, but he doesn't like chicken. To tell you the truth, Mrs. Bird, I don't like chicken either."},{"id":"book-1-lesson-51","bookNumber":1,"number":51,"title":"A pleasant climate","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-051-a-pleasant-climate-44988369/","text":"Lesson 51. A pleasant climate.\n\nListen to the tape, then answer this question. Does it ever snow in Greece?\n\nWhere do you come from? I come from Greece. What's the climate like in your country? It's very pleasant.\n\nWhat's the weather like in spring? It's often windy in March. It's always warm in April and May, but it rains sometimes. What's it like in summer?\n\nIt's always hot in June, July, and August. The sun shines every day. Is it cold or warm in autumn? It's always warm in September and October.\n\nIt's often cold in November, and it rains sometimes. Is it very cold in winter? It's often cold in December, January, and February. It snows sometimes."},{"id":"book-1-lesson-53","bookNumber":1,"number":53,"title":"An interesting climate","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-053-an-interesting-climate-44988375/","text":"Lesson 53. An interesting climate.\n\nListen to the tape, then answer this question. What is the favorite subject of conversation in England?\n\nWhere do you come from? I come from England. What's the climate like in your country? It's mild, but it's not always pleasant.\n\nThe weather's often cold in the north and windy in the east. It's often wet in the west and sometimes warm in the south. Which seasons do you like best? I like spring and summer.\n\nThe days are long and the nights are short. The sun rises early and sets late. I don't like autumn and winter. The days are short and the nights are long.\n\nThe sun rises late and sets early. Our climate is not very good, but it's certainly interesting. It's our favorite subject of conversation."},{"id":"book-1-lesson-55","bookNumber":1,"number":55,"title":"The Sawyer Family","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-055-the-sawyer-family-44988374/","text":"Lesson 55. The Sawyer Family.\n\nListen to the tape, then answer this question. When do the children do their homework?\n\nThe Sawyers live at 87 King Street. In the morning, Mrs. Sawyer goes to work and the children go to school. Their father takes them to school every day. Mrs. Sawyer stays at home every day.\n\nShe does the housework. She always eats her lunch at noon. In the afternoon, she usually sees her friends. They often drink tea together.\n\nIn the evening, the children come home from school. They arrive home early. Mr. Sawyer comes home from work. He arrives home late.\n\nAt night, the children always do their homework. Then they go to bed. Mr. Sawyer usually reads his newspaper. But sometimes he and his wife watch television."},{"id":"book-1-lesson-57","bookNumber":1,"number":57,"title":"An unusual day","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-057-an-unusual-day-44988372/","text":"Lesson 57. An unusual day.\n\nListen to the tape, then answer this question. What is Mr. Sawyer doing tonight?\n\nIt is eight o'clock. The children go to school by car every day. But today they're going to school on foot. It is ten o'clock.\n\nMrs. Sawyer usually stays at home in the morning. But this morning she is going to the shops. It is four o'clock. In the afternoon, Mrs. Sawyer usually drinks tea in the living room.\n\nBut this afternoon she is drinking tea in the garden. It is six o'clock. In the evening, the children usually do their homework. But this evening, they are not doing their homework.\n\nAt the moment, they're playing in the garden. It is nine o'clock. Mr. Sawyer usually reads his newspaper at night. But he's not reading his newspaper tonight.\n\nAt the moment, he's reading an interesting book."},{"id":"book-1-lesson-59","bookNumber":1,"number":59,"title":"Is that all?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-059-is-that-all-44988378/","text":"Lesson 59. Is that all?\n\nListen to the tape, then answer this question. Does the lady buy any chalk?\n\nI want some envelopes, please. Do you want the large size or the small size? The large size, please. Do you have any writing paper?\n\nYes, we do. I don't have any small pads. I only have large ones. Do you want a pad?\n\nYes, please. And I want some glue. A bottle of glue. And I want a large box of chalk, too.\n\nI only have small boxes. Do you want one? No, thank you. Is that all?\n\nThat's all, thank you. What else do you want? I want my change."},{"id":"book-1-lesson-61","bookNumber":1,"number":61,"title":"A bad cold","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-061-a-bad-cold-44988377/","text":"Lesson 61. A bad cold.\n\nListen to the tape, then answer this question. What is good news for Jimmy?\n\nWhere's Jimmy? He's in bed. What's the matter with him? He feels ill.\n\nHe looks ill. We must call the doctor. Yes, we must. Can you remember the doctor's telephone number?\n\nYes, it's 09754. Open your mouth, Jimmy. Show me your tongue. Say, ah.\n\nWhat's the matter with him, doctor? He has a bad cold, Mr. Williams. So he must stay in bed for a week. That's good news for Jimmy.\n\nGood news? Why? Because he doesn't like school."},{"id":"book-1-lesson-63","bookNumber":1,"number":63,"title":"Thank you, Doctor","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-063-thank-you-doctor-44988380/","text":"Lesson 63. Thank you, Doctor.\n\nListen to the tape, then answer this question. Who else is in bed today?\n\nWhy? How's Jimmy today? Better, thank you, Doctor. Can I see him, please, Mrs. Williams?\n\nCertainly, Doctor. Come upstairs. You look very well, Jimmy. You are better now.\n\nBut you mustn't get up yet. You must stay in bed for another two days. The boy mustn't go to school yet, Mrs. Williams, and he mustn't eat rich food. Does he have a temperature, Doctor?\n\nNo, he doesn't. Must he stay in bed? Yes, he must remain in bed for another two days. He can get up for about two hours each day, but you must keep the room warm.\n\nWhere's Mr. Williams this evening? He's in bed, Doctor. Can you see him, please? He has a bad cold, too."},{"id":"book-1-lesson-65","bookNumber":1,"number":65,"title":"Not a baby","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-065-not-a-baby-44988387/","text":"Lesson 65. Not a baby.\n\nListen to the tape, then answer this question. Does Jill take the key to the front door?\n\nWhat are you going to do this evening, Jill? I'm going to meet some friends, Dad. You mustn't come home late. You must be home at half past ten.\n\nI can't get home so early, Dad. Can I have the key to the front door, please? No, you can't. Jill's 18 years old, Tom.\n\nShe's not a baby. Give her the key. She always comes home early. Oh, all right.\n\nHere you are. But you mustn't come home after a quarter past eleven. Do you hear? Yes, Dad.\n\nThanks, Mum. That's all right. Goodbye. Enjoy yourself.\n\nWe always enjoy ourselves, Mum. Bye-bye."},{"id":"book-1-lesson-67","bookNumber":1,"number":67,"title":"The weekend","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-067-the-weekend-44988384/","text":"Lesson 67. The weekend\n\nListen to the tape, then answer this question. What are the Johnsons going to do at the weekend?\n\nHello, were you at the butcher's? Yes, I was. Were you at the butcher's too? No, I wasn't.\n\nI was at the greengrocer's. How's Jimmy today? He's very well, thank you. Was he absent from school last week?\n\nYes, he was. He was absent on Monday, Tuesday, Wednesday and Thursday. How are you all keeping? Very well, thank you.\n\nWe're going to spend three days in the country. We're going to stay at my mother's for the weekend. Friday, Saturday and Sunday in the country. Aren't you lucky?"},{"id":"book-1-lesson-69","bookNumber":1,"number":69,"title":"The car race","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-069-the-car-race-44988382/","text":"Lesson 69. The car race.\n\nListen to the tape, then answer this question. Which car was the winner in 1995?\n\nThere is a car race near our town every year. In 1995, there was a very big race. There were hundreds of people there. My wife and I were at the race.\n\nOur friends, Julie and Jack, were there too. You can see us in the crowd. We are standing on the left. There were twenty cars in the race.\n\nThere were English cars, French cars, German cars, Italian cars, American cars, and Japanese cars. It was an exciting finish. The winner was Billy Stewart. He was in car number fifteen.\n\nFive other cars were just behind him. On the way home, my wife said to me, \"Don't drive so quickly!\" \"You're not Billy Stewart!\""},{"id":"book-1-lesson-71","bookNumber":1,"number":71,"title":"He's awful!","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-071-hes-awful-44988939/","text":"Lesson 71. He's awful!\n\nListen to the tape, then answer this question. What's Ron Marston like, Pauline?\n\nHe's awful! He telephoned me four times yesterday, and three times the day before yesterday. He telephoned the office yesterday morning and yesterday afternoon. My boss answered the telephone.\n\nWhat did your boss say to him? He said, \"Pauline is typing letters. She can't speak to you now!\" Then I arrived home at six o'clock yesterday evening.\n\nHe telephoned again. But I didn't answer the phone! Did he telephone again last night? Yes, he did.\n\nHe telephoned at nine o'clock. What did you say to him? I said, \"This is Pauline's mother. Please don't telephone my daughter again!\"\n\nDid he telephone again? No, he didn't!"},{"id":"book-1-lesson-73","bookNumber":1,"number":73,"title":"The way to King Street","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-073-the-way-to-king-street-44988386/","text":"Lesson 73. The way to King Street.\n\nListen to the tape, then answer this question. Why did the man need a phrase book?\n\nLast week, Mrs. Mills went to London. She does not know London very well, and she lost her way. Suddenly, she saw a man near a bus stop. I can ask him the way, she said to herself.\n\nExcuse me, she said. Can you tell me the way to King Street, please? The man smiled pleasantly. He did not understand English.\n\nHe spoke German. He was a tourist. Then he put his hand into his pocket and took out a phrase book. He opened the book and found a phrase.\n\nHe read the phrase slowly. I am sorry, he said. I do not speak English."},{"id":"book-1-lesson-75","bookNumber":1,"number":75,"title":"Uncomfortable shoes","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-075-uncomfortable-shoes-44988389/","text":"Lesson 75. Uncomfortable shoes.\n\nListen to the tape, then answer this question. What's wrong with the fashionable shoes?\n\nDo you have any shoes like these? What size? Size 5. What colour?\n\nBlack. I'm sorry, we don't have any. But my sister bought this pair last month. Did she buy them here?\n\nNo, she bought them in the U.S. We had some shoes like those a month ago, but we don't have any now. Can you get a pair for me, please? I'm afraid that I can't.\n\nThey were in fashion last year and the year before last, but they're not in fashion this year. These shoes are in fashion now. They look very uncomfortable. They are very uncomfortable, but women always wear uncomfortable shoes."},{"id":"book-1-lesson-77","bookNumber":1,"number":77,"title":"Terrible toothache","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-077-terrible-toothache-44988391/","text":"Lesson 77. Terrible toothache\n\nListen to the tape, then answer this question. What time of day is it, do you think?\n\nHow do you know? Good morning, Mr. Croft. Good morning, nurse. I want to see the dentist, please.\n\nDo you have an appointment? No, I don't. Is it urgent? Yes, it is.\n\nIt's very urgent. I feel awful. I have a terrible toothache. Can you come at 10 a.m. on Monday, April the 24th?\n\nI must see the dentist now, nurse. The dentist is very busy at the moment. Can you come at 2 p.m.? That's very late.\n\nCan the dentist see me now? I'm afraid that he can't, Mr. Croft. Can't you wait till this afternoon? I can wait, but my toothache can't."},{"id":"book-1-lesson-79","bookNumber":1,"number":79,"title":"Carol's shopping-list","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-079-carols-shopping-list-44988390/","text":"Lesson 79. Carol's shopping-list\n\nListen to the tape, then answer this question. What is Carol not going to buy?\n\nWhat are you doing, Carol? I'm making a shopping list, Tom. What do we need? We need a lot of things this week.\n\nI must go to the grocer's. We haven't got much tea or coffee, and we haven't got any sugar or jam. What about vegetables? I must go to the greengrocer's.\n\nWe haven't got many tomatoes, but we've got a lot of potatoes. I must go to the butcher's, too. We need some meat. We haven't got any meat at all.\n\nHave we got any beer and wine? No, we haven't, and I'm not going to get any. I hope that you've got some money. I haven't got much.\n\nWell, I haven't got much either."},{"id":"book-1-lesson-81","bookNumber":1,"number":81,"title":"Roast beef and potatoes","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-081-roast-beef-and-potatoes-44988942/","text":"Lesson 81. Roast beef and potatoes\n\nListen to the tape then answer this question. Why is Carol disappointed?\n\nHi, Carol! Where's Tom? He's upstairs. He's having a bath.\n\nTom! Yes? Sam's here. I'm nearly ready.\n\nHello, Sam. Have a cigarette. No thanks, Tom. Have a glass of whisky then.\n\nO.K. Thanks. Is dinner ready, Carol? It's nearly ready.\n\nWe can have dinner at seven o'clock. Sam and I had lunch together today. We went to a restaurant. What did you have?\n\nWe had roast beef and potatoes. Oh! What's the matter, Carol? Well, you're going to have roast beef and potatoes again tonight!"},{"id":"book-1-lesson-83","bookNumber":1,"number":83,"title":"Going on holiday","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-083-going-on-holiday-44988943/","text":"Lesson 83. Going on holiday.\n\nListen to the tape, then answer this question. Where did Sam go for his holiday this year?\n\nCarol :Hello, Sam. Come in.\n\nTom :Hi, Sam. We're having lunch. Do you want to have lunch with us?\n\nSam :No thank you, Tom. I've already had lunch. I had lunch at half past twelve.\n\nCarol :Have a cup of coffee then.\n\nSam :I've just had a cup, thank you. I had one after my lunch.\n\nTom :Let's go into the living-room, Carol. We can have our coffee there.\n\nCarol :Excuse the mess, Sam. This room's very untidy. We're packing our suitcases. We're going to leave tomorrow. Tom and I are going to have a holiday.\n\nSam :Aren't you lucky!\n\nTom :When are you going to have a holiday, Sam?\n\nSam :I don't know. I've already had my holiday this year.\n\nCarol :Where did you go?\n\nSam :I stayed at home!"},{"id":"book-1-lesson-85","bookNumber":1,"number":85,"title":"Paris in the spring","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-085-paris-in-the-spring-44988946/","text":"Lesson 85. Paris in the spring.\n\nListen to the tape, then answer this question. At what time of year did Ken visit Paris?\n\nGeorge : Hello, Ken.\n\nKen : Hi, George.\n\nGeorge : Have you just been to the cinema?\n\nKen : Yes, I have.\n\nGeorge : What's on?\n\nKen : \"Paris in the Spring\".\n\nGeorge : Oh, I've already seen it. I saw it on television last year. It's an old film, but it's very good.\n\nKen : Paris is a beautiful city.\n\nGeorge : I've never been there. Have you ever been there, Ken?\n\nKen : Yes, I have. I was there in April.\n\nGeorge : Paris in the spring, eh?\n\nKen : It was spring, but the weather was awful. It rained all the time.\n\nGeorge : Just like London!"},{"id":"book-1-lesson-87","bookNumber":1,"number":87,"title":"A car crash","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-087-a-car-crash-44988948/","text":"Lesson 87. A car crash.\n\nListen to the tape, then answer this question. Can the mechanics repair Mr. Wood's car?\n\nMr Wood : Is my car ready yet?\n\nAttendant : I don't know, sir. What's the number of your car?\n\nMr Wood : It's LFZ 312 G.\n\nAttendant : When did you bring it to us?\n\nMr Wood : I brought it here three days ago.\n\nAttendant : Ah yes, I remember now.\n\nMr Wood : Have your mechanics finished yet?\n\nAttendant : No, they're still working on it. Let's go into the garage and have a look at it. Attendant : Isn't that your car?\n\nMr Wood : Well, it was my car.\n\nAttendant : Didn't you have a crash?\n\nMr Wood : That's right. I drove it into a lamp post. Can your mechanics repair it?\n\nAttendant : Well, they're trying to repair it, sir. But to tell you the truth, you need a new car."},{"id":"book-1-lesson-89","bookNumber":1,"number":89,"title":"For sale","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-089-for-sale-44988950/","text":"Lesson 89. For sale.\n\nListen to the tape, then answer this question. Why couldn't Nigel decide?\n\nNigel : Good afternoon. I believe that this house is for sale.\n\nIan : That's right.\n\nNigel : May I have a look at it please?\n\nIan : Yes, of course. Come in.\n\nNigel : How long have you lived here?\n\nIan : I have lived here for twenty years.\n\nNigel : Twenty years! That's a long time.\n\nIan : Yes, I have been here since 1976.\n\nNigel : Then why do you want to sell it?\n\nIan : Because I have just retired. I want to buy a small house in the country.\n\nNigel : How much does this house cost?\n\nIan : £68500.\n\nNigel : That's a lot of money!\n\nIan : It's worth every penny of it.\n\nNigel : Well, I like the house, but I can't decide yet. My wife must see it first.\n\nIan : Women always have the last word."},{"id":"book-1-lesson-91","bookNumber":1,"number":91,"title":"Poor Ian","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-091-poor-ian-44988952/","text":"Lesson 91. Poor Ian.\n\nListen to the tape, then answer this question. Who wanted to sell the house?\n\nCatherine : Has Ian sold his house yet?\n\nJenny : Yes, he has. He sold it last week.\n\nCatherine : Has he moved to his new house yet?\n\nJenny : No, not yet. He's still here. He's going to move tomorrow.\n\nCatherine : When? Tomorrow morning?\n\nJenny : No. Tomorrow afternoon. I'll miss him. He has always been a good neighbour.\n\nLinda : He's a very nice person. We'll all miss him.\n\nCatherine : When will the new people move into this house?\n\nJenny : I think that they'll move in the day after tomorrow.\n\nLinda : Will you see Ian today, Jenny?\n\nJenny : Yes, I will.\n\nLinda : Please give him my regards.\n\nCatherine : Poor Ian! He didn't want to leave this house.\n\nJenny : No, he didn't want to leave. but his wife did!"},{"id":"book-1-lesson-93","bookNumber":1,"number":93,"title":"Our new neighbour","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-093-our-new-neighbour-44988401/","text":"Lesson 93. Our new neighbour.\n\nListen to the tape, then answer this question. Why is Nigel a lucky man?\n\nNigel is our new next-door neighbour. He's a pilot. He was in the R.A.F. He will fly to New York next month.\n\nThe month after next he will fly to Tokyo. At the moment, he's in Madrid. He flew to Spain a week ago. He will return to London the week after next.\n\nHe's only forty-one years old, and he has already been to nearly every country in the world. Nigel is a very lucky man. But his wife isn't very lucky. She usually stays at home!"},{"id":"book-1-lesson-95","bookNumber":1,"number":95,"title":"Tickets, please","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-095-tickets-please-44988953/","text":"Lesson 95. Tickets, please.\n\nListen to the tape, then answer this question. Why did George and Ken miss the train?\n\nGeorge : Two return tickets to London please. What time will the next train leave?\n\nAttendant : At nineteen minutes past eight.\n\nGeorge : Which platform?\n\nAttendant : Platform Two. Over the bridge.\n\nKen : What time will the next train leave?\n\nGeorge : At eight nineteen.\n\nKen : We've got plenty of time.\n\nGeorge : It's only three minutes to eight.\n\nKen : Let's go and have a drink. There's a bar next door to the station.\n\nGeorge : We had better go back to the station now, Ken.\n\nPorter : Tickets please.\n\nGeorge : We want to catch the eight nineteen to London.\n\nPorter : You've just missed it!\n\nGeorge : What! It's only eight fifteen.\n\nPorter : I'm sorry, sir. That clock's ten minutes slow.\n\nGeorge : When's the next train?\n\nPorter : In five hours' time!"},{"id":"book-1-lesson-97","bookNumber":1,"number":97,"title":"A small blue case","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-097-a-small-blue-case-44988498/","text":"Lesson 97. A small blue case.\n\nListen to the tape, then answer this question. Does Mr. Hall get his case back?\n\nMr Hall : I left a suitcase on the train to London the other day.\n\nAttendant : Can you describe it, sir?\n\nMr Hall : It's a small blue case and it's got a zip. There's a label on the handle with my name and address on it.\n\nAttendant : Is this case yours?\n\nMr Hall : No, that's not mine.\n\nAttendant : What about this one? This one's got a label.\n\nMr Hall : Let me see it.\n\nAttendant : What's your name and address?\n\nMr Hall : David Hall, 83, Bridge Street.\n\nAttendant : That's right. D. N. Hall, 83, Bridge Street. Attendant : Three pounds fifty pence, please.\n\nMr Hall : Here you are.\n\nAttendant : Thank you.\n\nMr Hall : Hey!\n\nAttendant : What's the matter?\n\nMr Hall : This case doesn't belong to me! You've given me the wrong case!"},{"id":"book-1-lesson-99","bookNumber":1,"number":99,"title":"Ow!","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-099-ow-44988974/","text":"Lesson 99. Ow!.\n\nListen to the tape, then answer this question. Must Andy go to see the doctor?\n\nAndy : Ow!\n\nLucy : What's the matter, Andy?\n\nAndy : I slipped and fell downstairs.\n\nLucy : Have you hurt yourself?\n\nAndy : Yes, I have. I think that I've hurt my back.\n\nLucy : Try and stand up. Can you stand up? Here. Let me help you.\n\nAndy : I'm sorry, Lucy. I'm afraid that I can't get up.\n\nLucy : I think that the doctor had better see you. I'll phone Dr. Carter. Lucy : The doctor says that he will come at once. I'm sure that you need an X-ray, Andy."},{"id":"book-1-lesson-101","bookNumber":1,"number":101,"title":"A card from Jimmy","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-101-a-card-from-jimmy-44988975/","text":"Lesson 101. A card from Jimmy.\n\nListen to the tape, then answer this question. Does Grandmother seem pleased to get a card from Jimmy?\n\nWhy or why not?\n\nGrandmother : Read Jimmy's card to me please, Penny.\n\nPenny : \"I have just arrived in Scotland and I'm staying at a Youth Hostel.\"\n\nGrandmother : Eh?\n\nPenny : He says he's just arrived in Scotland. He says he's staying at a Youth Hostel. You know he's a member of the Y. H. A.\n\nGrandmother : The what?\n\nPenny : The Y. H. A., Mum. The Youth Hostel's Association.\n\nGrandmother : What else does he say?\n\nPenny : \"I'll write a letter soon. I hope you are all well.\"\n\nGrandmother : What? Speak up, Penny. I'm afraid I can't hear you.\n\nPenny : He says he'll write a letter soon. He hopes we are all well. \"Love, Jimmy.\"\n\nGrandmother : Is that all? He doesn't say very much, does he?\n\nPenny : He can't write very much on a card, Mum."},{"id":"book-1-lesson-103","bookNumber":1,"number":103,"title":"The French test","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-103-the-french-test-44988499/","text":"Lesson 103. The French test.\n\nListen to the tape, then answer this question. How long did the exam last?\n\nGary : How was the exam, Richard?\n\nRichard : Not too bad. I think I passed in English and Mathematics. The questions were very easy. How about you, Gary?\n\nGary : The English and Maths papers weren't easy enough for me. I hope I haven't failed.\n\nRichard : I think I failed the French paper. I could answer sixteen of the questions. They were very easy. But I couldn't answer the rest. They were too difficult for me.\n\nGary : French tests are awful, aren't they?\n\nRichard : I hate them. I'm sure I've got a low mark\n\nGary : Oh, cheer up! Perhaps we didn't do too badly. The guy next to me wrote his name at the top of the paper.\n\nRichard : Yes?\n\nGary : Then he sat there and looked at it for three hours! He didn't write a word!"},{"id":"book-1-lesson-105","bookNumber":1,"number":105,"title":"Full of mistakes","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-105-full-of-mistakes-44988956/","text":"Lesson 105. Full of mistakes.\n\nListen to the tape, then answer this question. What was Sandra's present?\n\nThe Boss : Where's Sandra, Bob? I want her.\n\nBob : Do you want to speak to her?\n\nThe Boss : Yes, I do. I want her to come to my office. Tell her to come at once.\n\nSandra : Did you want to see me?\n\nThe Boss : Ah, yes, Sandra. How do you spell \"intelligent\"? Can you tell me?\n\nSandra : I-N-T-E-L-L-I-G-E-N-T.\n\nThe Boss : That's right. You've typed it with only one \"L\". This letter's full of mistakes. I want you to type it again.\n\nSandra : Yes, I'll do that. I'm sorry about that.\n\nThe Boss : And here's a little present for you.\n\nSandra : What is it?\n\nThe Boss : It's a dictionary. I hope it'll help you."},{"id":"book-1-lesson-107","bookNumber":1,"number":107,"title":"It's too small","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-107-its-too-small-44988976/","text":"Lesson 107. It's too small.\n\nListen to the tape, then answer this question. What kind of dress does the lady want?\n\nAssistant : Do you like this dress, madam?\n\nLady : I like the colour very much. It's a lovely dress, but it's too small for me.\n\nAssistant : What about this one? It's a lovely dress. It's very smart. Short skirts are in fashion now. Would you like to try it?\n\nLady : All right. Lady : I'm afraid this green dress is too small for me as well. It's smaller than the blue one. Lady : I don't like the colour either. It doesn't suit me at all.\n\nI think the blue dress is prettier. Lady : Could you show me another blue dress? I want a dress like that one, but it must be my size.\n\nAssistant : I'm afraid I haven't got a larger dress. This is the largest dress in the shop."},{"id":"book-1-lesson-109","bookNumber":1,"number":109,"title":"A good idea","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-109-a-good-idea-44988979/","text":"Lesson 109. A good idea.\n\nListen to the tape, then answer this question. What does Jane have with her coffee?\n\nCharlotte : Shall I make some coffee, Jane?\n\nJane : That's a good idea, Charlotte.\n\nCharlotte : It's ready. Do you want any milk?\n\nJane : Just a little please.\n\nCharlotte : What about some sugar? Two teaspoonfuls?\n\nJane : No, less than that. One and a half teaspoonfuls please. That's enough for me. Jane : That was very nice.\n\nCharlotte : Would you like some more?\n\nJane : Yes, please. Jane : I'd like a cigarette, too. May I have one?\n\nCharlotte : Of course. I think there are a few in that box.\n\nJane : I'm afraid it's empty.\n\nCharlotte : What a pity!\n\nJane : It doesn't matter.\n\nCharlotte : Have a biscuit instead. Eat more and smoke less!\n\nJane : That's very good advice!"},{"id":"book-1-lesson-111","bookNumber":1,"number":111,"title":"The most expensive model","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-111-the-most-expensive-model-44988957/","text":"Lesson 111. The most expensive model.\n\nListen to the tape, then answer this question. Can Mr. Frith buy the television on instalments?\n\nHow does it work?\n\nMr Frith : I like this television very much. How much does it cost?\n\nAssistant : It's the most expensive model in the shop. It costs 500 pounds.\n\nMrs Frith : That's too expensive for us. We can't afford all that money.\n\nAssistant : This model's less expensive than that one. It's only 300 pounds. But, of course, it's not as good as the expensive one.\n\nMr Frith : I don't like this model. The other model's more expensive, but it's worth the money. Mr Frith : Can we buy it on instalments?\n\nAssistant : Of course. You can pay a deposit of 30 pounds, and then 14 pounds a month for 3 years.\n\nMr Frith : Do you like it, dear?\n\nMrs Frith : I certainly do, but I don't like the price. You always want the best, but we can't afford it. Sometimes you think you're a millionaire!\n\nMr Frith : Millionaires don't buy things on instalments!"},{"id":"book-1-lesson-113","bookNumber":1,"number":113,"title":"Small change","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-113-small-change-44988958/","text":"Lesson 113. Small change.\n\nListen to the tape, then answer this question. Who has got some small change?\n\nConductor : Fares please!\n\nMan : Trafalgar Square please.\n\nConductor : I'm sorry, sir. I can't change a ten pound note. Haven't you got any small change?\n\nMan : I've got no small change, I'm afraid.\n\nConductor : I'll ask some of the passengers. Conductor : Have you any small change, sir? 1stPassenger : I'm sorry. I've got none. 2ndPassenger : I haven't got any either.\n\nConductor : Can you change this ten pound note, madam? 3rdPassenger : I'm afraid I can't. 4thPassenger : Neither can I. Conductor : I'm very sorry, sir. You must get off the bus.\n\nNone of our passengers can change this note. They're all millionaires! TwoTramps : Except us. 1stTramp : I've got some small change. 2ndTramp : So have I."},{"id":"book-1-lesson-115","bookNumber":1,"number":115,"title":"Knock, knock!","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-115-knock-knock-44988960/","text":"Lesson 115. Knock, knock!.\n\nListen to the tape, then answer this question. What does Jim have to drink?\n\nHelen : Isn't there anyone at home?\n\nJim : I'll knock again, Helen. Everything's very quiet. I'm sure there's no one at home.\n\nHelen : But that's impossible. Carol and Tom invited us to lunch. Look through the window. Helen : Can you see anything?\n\nJim : Nothing at all.\n\nHelen : Let's try the back door.\n\nJim : Look! Everyone's in the garden.\n\nCarol : Hello, Helen. Hullo, Jim.\n\nTom : Everybody wants to have lunch in the garden. It's nice and warm out here.\n\nCarol : Come and have something to drink.\n\nJim : Thanks, Carol. May I have a glass of beer please?\n\nCarol : Beer? There's none left. You can have some lemonade.\n\nJim : Lemonade!\n\nTom : Don't believe her, Jim. She's only joking. Have some beer!"},{"id":"book-1-lesson-117","bookNumber":1,"number":117,"title":"Tommy's breakfast","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-117-tommys-breakfast-44988431/","text":"Lesson 117. Tommy's breakfast.\n\nListen to the tape, then answer this question. What does she mean by 'change' in the last sentence?\n\n'When my husband was going into the dining-room this morning , he dropped some coins on the floor. There were coins everywhere. We looked for them, but we could not find them all. 'While we were having breakfast, our little boy, Tommy, found two small coins on the floor.\n\nHe put them both into his mouth. We both tried to get the coins, but it was too late. Tommy had already swallowed them! Later that morning, when I was doing the housework, my husband telephoned me from the office.\n\n'How's Tommy?' he asked. 'I don't know,' I answered, 'Tommy's been to the toliet three times this morning, but I haven't had any change yet!'"},{"id":"book-1-lesson-119","bookNumber":1,"number":119,"title":"A true story","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-119-a-true-story-44988433/","text":"Lesson 119. A true story.\n\nListen to the tape, then answer this question. Who called out to the thieves in the dark?\n\nDo you like stories? I want to tell you a true story. It happened to a friend of mine a year ago. While my friend, George, was reading in bed, two thieves climbed into his kitchen.\n\nAfter they had entered the house, they went into the dining-room. It was very dark, so they turned on a torch. Suddenly, they heard a voice behind them. “What's up?\n\nWhat's up?” someone called. The thieves dropped the torch and ran away as quickly as they could. George heard the noise and came downstairs quickly. He turned on the light, but he couldn't see anyone.\n\nThe thieves had already gone. But George's parrot, Henry, was still there. 'What's up, George?' he called.\n\n'Nothing, Henry,'”' George said and smiled. 'Go back to sleep.'"},{"id":"book-1-lesson-121","bookNumber":1,"number":121,"title":"The man in a hat","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-121-the-man-in-a-hat-44988961/","text":"Lesson 121. The man in a hat.\n\nListen to the tape, then answer this question. Why didn't Caroline recognize the customer straight away?\n\nCustomer : I bought two expensive dictionaries here half an hour ago, but I forgot to take them with me.\n\nManager : Who served you, sir?\n\nCustomer : The lady who is standing behind the counter.\n\nManager : Which books did you buy?\n\nCustomer : The books which are on the counter.\n\nManager : Did you serve this gentleman half an hour ago, Caroline? He says he's the man who bought these books.\n\nCaroline : I can't remember. The man whom I served was wearing a hat.\n\nManager : Have you got a hat, sir?\n\nCustomer : Yes, I have.\n\nManager : Would you put it on, please?\n\nCustomer : All right.\n\nManager : Is this the man that you served, Caroline?\n\nCaroline : Yes, I recognize him now."},{"id":"book-1-lesson-123","bookNumber":1,"number":123,"title":"A trip to Australia","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-123-a-trip-to-australia-44988962/","text":"Lesson 123. A trip to Australia.\n\nListen to the tape, then answer this question. Who is the man with the beard?\n\nMike : Look, Scott. This is a photograph I took during my trip to Australia.\n\nScott : Let me see it, Mike. Scott : This is a good photograph. Who are these people?\n\nMike : They're people I met during the trip. Mike : That's the ship we traveled on.\n\nScott : What a beautiful ship! Scott : Who's this?\n\nMike : That's the man I told you about. Remember?\n\nScott : Ah yes. The one who offered you a job in Australia.\n\nMike : That's right.\n\nScott : Who's this?\n\nMike : Guess!\n\nScott : It's not you, is it?\n\nMike : That's right. Mike : I grew a beard during the trip, but I shaved it off when I came home.\n\nScott : Why did you shave it off?\n\nMike : My wife didn't like it!"},{"id":"book-1-lesson-125","bookNumber":1,"number":125,"title":"Tea for two","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-125-tea-for-two-44988503/","text":"Lesson 125. Tea for two.\n\nListen to the tape, then answer this question. Does Susan have tea by herself?\n\nSusan : Can't you come in and have tea now, Peter?\n\nPeter : Not yet, I must water the garden first.\n\nSusan : Do you have to water it now?\n\nPeter : I'm afraid I must. Look at it! It's terribly dry.\n\nSusan : What a nuisance!\n\nPeter : Last summer it was very dry, too. Don't you remember? I had to water it every day.\n\nSusan : Well, I'll have tea by myself. Susan : That was quick! Have you finished already?\n\nPeter : Yes. Look out of the window.\n\nSusan : It's raining. That means you needn't water the garden.\n\nPeter : That was a pleasant surprise. It means I can have tea, instead."},{"id":"book-1-lesson-127","bookNumber":1,"number":127,"title":"A famous actress","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-127-a-famous-actress-44988966/","text":"Lesson 127. A famous actress.\n\nListen to the tape, then answer this question. Who is only twenty-nine, and why is it so unclear?\n\nKate : Can you recognize that woman, Liz?\n\nLiz : I think I can, Kate. It must be Karen Marsh, the actress.\n\nKate : I thought so. Who's that beside her?\n\nLiz : That must be Conrad Reeves.\n\nKate : Conrad Reeves, the actor? It can't be. Let me have another look. I think you're right! Isn't he her third husband?\n\nLiz : No, He must be her fourth or fifth.\n\nKate : Doesn't Karen Marsh look old!\n\nLiz : She does, doesn't she! I read she's twenty-nine, but she must be at least forty.\n\nKate : I'm sure she is.\n\nLiz : She was a famous actress when I was still at school .\n\nKate : That was a long time ago, wasn't it?\n\nLiz : Not that long ago! I'm not more than twenty-nine myself."},{"id":"book-1-lesson-129","bookNumber":1,"number":129,"title":"Seventy miles an hour","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-129-seventy-miles-an-hour-44988967/","text":"Lesson 129. Seventy miles an hour.\n\nListen to the tape, then answer this question. What does Ann advise her husband to do next time?\n\nAnn : Look, Gary! That policeman's waving to you. He wants you to stop.\n\nPoliceman : Where do you think you are? On a race track? You must have been driving at seventy miles an hour.\n\nGary : I can't have been.\n\nPoliceman : I was doing eighty when I overtook you. Policeman : Didn't you see the speed limit?\n\nGary : I'm afraid I didn't, officer. I must have been dreaming.\n\nAnn : He wasn't dreaming, officer. I was telling him to drive slowly.\n\nGary : That's why I didn't see the sign.\n\nPoliceman : Let me see your driving-license. Policeman : I won't charge you this time. But you'd better not do it again!\n\nGary : Thank you. I'll certainly be more careful.\n\nAnn : I told you to drive slowly, Gary.\n\nGary : You always tell me to drive slowly, darling.\n\nAnn : Well, next time you'd better take my advice!"},{"id":"book-1-lesson-131","bookNumber":1,"number":131,"title":"Don't be so sure!","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-131-dont-be-so-sure-44988507/","text":"Lesson 131. Don't be so sure!.\n\nListen to the tape, then answer this question. What's the problem about deciding on a holiday?\n\nMartin : Where are you going to spend your holidays this year, Gary?\n\nGary : We may go abroad. I'm not sure. My wife wants to go to Egypt. I'd like to go there, too. We can't make up our minds.\n\nMartin : Will you travel by sea or by air?\n\nGary : We may travel by sea.\n\nMartin : It's cheaper, isn't it?\n\nGary : It may be cheaper, but it takes a long time.\n\nMartin : I'm sure you will enjoy yourselves.\n\nGary : Don't be so sure. We may not go anywhere. My wife always worries too much. Who's going to look after the dog? Who's going to look after the house?\n\nWho's going to look after the garden? We have this problem every year. In the end, we stay at home and look after everything!"},{"id":"book-1-lesson-133","bookNumber":1,"number":133,"title":"Sensational news!","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-133-sensational-news-44988508/","text":"Lesson 133. Sensational news!.\n\nListen to the tape, then answer this question. What reason did Karen Marsh give for wanting to retire?\n\nReporter : Have you just made a new film, Miss Marsh?\n\nMiss Marsh : Yes, I have.\n\nReporter : Are you going to make another?\n\nMiss Marsh : No, I'm not. I'm going to retire. I feel very tired. I don't want to make another film for a long time.\n\nKate : Let's buy a newspaper, Liz. Listen to this! \"Karen Marsh: Sensational News! By our reporter, Alan Jones. Miss Karen Marsh arrived at London Airport today.\n\nShe was wearing a blue dress and a mink coat. She told me she had just made a new film. She said she was not going to make another. She said she was going to retire. She told reporters she felt very tired and didn't want to make another film for a long time.\"\n\nLiz : I wonder why."},{"id":"book-1-lesson-135","bookNumber":1,"number":135,"title":"The latest report","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-135-the-latest-report-44988509/","text":"Lesson 135. The latest report.\n\nListen to the tape, then answer this question. Is Karen Marsh going to retire, do you think?\n\nReporter : Are you really going to retire, Miss Marsh?\n\nMiss Marsh : I may. I can't make up my mind. I shall have to ask my future husband. He won't let me make another film.\n\nReporter : Your future husband, Miss Marsh?\n\nMiss Marsh : Yes. Let me introduce him to you. His name is Carlos. We are going to get married next week.\n\nKate : Look, Liz! Here's another report about Karen Marsh. Listen: \"Karen Marsh: The Latest. At her London Hotel today Miss Marsh told reporters she might retire. She said she couldn't make up her mind.\n\nShe said she would have to ask her future husband. She said her future husband would not let her make another film. Then she introduced us to Carlos and told us they would get married next week.\"\n\nLiz : That's sensational news, isn't it, Kate?\n\nKate : It certainly is. He'll be her sixth husband!"},{"id":"book-1-lesson-137","bookNumber":1,"number":137,"title":"A pleasant dream","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-137-a-pleasant-dream-44988968/","text":"Lesson 137. A pleasant dream.\n\nListen to the tape, then answer this question. What would Julie like to do, if she had the money?\n\nJune : Are you doing the football pools, Brian?\n\nBrian : Yes, I've nearly finished, June. I'm sure we will win something this week.\n\nJune : You always say that, but we never win anything! What will you do if you win a lot of money?\n\nBrian : If I win a lot of money, I shall buy you a mink coat.\n\nJune : I don't want a mink coat! I want to see the world.\n\nBrian : All right. If we win a lot of money, we shall travel around the world and we shall stay at the best hotels. Then we shall return home and buy a big house in the country. We shall have a beautiful garden and…\n\nJune : But if we spend all that money we shall be poor again. What shall we do then?\n\nBrian : If we spend all the money, we shall try and win the football pools again.\n\nJune : It's a pleasant dream, but everything depends on \"if\"!"},{"id":"book-1-lesson-139","bookNumber":1,"number":139,"title":"Is that you, John?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-139-is-that-you-john-44988969/","text":"Lesson 139. Is that you, John?.\n\nListen to the tape, then answer this question. Which John Smith does Graham Turner think he is talking to?\n\nGriham Turner : Is that you, John?\n\nJohn Smith : Yes, speaking.\n\nGriham Turner : Tell Mary we shall be late for dinner this evening.\n\nJohn Smith : I'm afraid I don't understand.\n\nGriham Turner : Hasn't Mary told you? She invited Betty and me to dinner this evening. I said I would be at your house at six o'clock, but the boss wants me to do some extra work. I'll have to stay at the office. I don't know when I shall finish.\n\nOh, and by the way, my wife wants to know if Mary needs any help.\n\nJohn Smith : I don't know what you're talking about.\n\nGriham Turner : That is John Smith, isn't it?\n\nJohn Smith : Yes, I'm John Smith.\n\nGriham Turner : You are John Smith, the engineer, aren't you?\n\nJohn Smith : That's right.\n\nGriham Turner : You work for the Overseas Engineering Company, don't you?\n\nJohn Smith : No, I don't. I'm John Smith the telephone engineer and I'm repairing your telephone line."},{"id":"book-1-lesson-141","bookNumber":1,"number":141,"title":"Sally's first train ride","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-141-sallys-first-train-ride-44988514/","text":"Lesson 141. Sally's first train ride.\n\nListen to the tape, then answer this question. Why was the mother embarrassed?\n\nLast week, my four-year-old daughter, Sally, was invited to a children's party. I decided to take her by train. Sally was very excited because she had never traveled on a train before. She sat near the window and asked questions about everything she saw.\n\nSuddenly, a middle-aged lady got on the train and sat opposite Sally. 'Hello, little girl.' She said. Sally did not answer, but looked at her curiously. The lady was dressed in a blue coat and a large, funny hat.\n\nAfter the train had left the station, the lady opened her handbag and took out her powder compact. She then began to make up her face. 'Why are you doing that?' Sally asked.\n\n'To make myself beautiful,'the lady answered. She put away her compact and smiled kindly. 'But you are still ugly. 'Sally said.\n\nSally was amused, but I was very embarrassed!"},{"id":"book-1-lesson-143","bookNumber":1,"number":143,"title":"A walk through the woods","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2766680/1-143-a-walk-through-the-woods-44988516/","text":"Lesson 143. A walk through the woods.\n\nListen to the tape, then answer this question. What was so funny about the words on the sign?\n\nI live in a very old town which is surrounded by beautiful woods. It is a famous beauty spot. On Sundays, hundreds of people come from the city to see our town and to walk through the woods. Visitors have been asked to keep the woods clean and tidy.\n\nLitter baskets have been placed under the trees, but people still throw their rubbish everywhere. Last Wednesday, I went for a walk in the woods. What I saw made me very sad. I counted seven old cars and three old refrigerators.\n\nThe little baskets were empty and the ground was covered with pieces of paper, cigarette ends, old tyres, empty bottles and rusty tins. Among the rubbish, I found a sign which said, 'Anyone who leaves litter in these woods will be prosecuted!'"}]},{"number":2,"title":"New Concept English 2","subtitle":"Practice and Progress","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/","lessons":[{"id":"book-2-lesson-1","bookNumber":2,"number":1,"title":"A private conversation","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-001-a-private-conversation-45060074/","text":"Lesson 1. A private conversation.\n\nFirst listen and then answer the question.\n\nWhy did the writer complain to the people behind him?\n\nLast week I went to the theatre.\n\nI had a very good seat.\n\nThe play was very interesting.\n\nI did not enjoy it.\n\nA young man and a young woman were sitting behind me.\n\nThey were talking loudly.\n\nI got very angry.\n\nI could not hear the actors.\n\nI turned round.\n\nI looked at the man and the woman angrily.\n\nThey did not pay any attention.\n\nIn the end, I could not bear it.\n\nI turned round again.\n\n'I can't hear a word!' I said angrily.\n\n'It's none of your business,' the young man said rudely.\n\n'This is a private conversation!'"},{"id":"book-2-les
