:"Lesson 54. Instinct or cleverness?\n\nListen to the tape, then answer the question below.\n\nWas the writer successful in protecting his peach tree? Why not?\n\nWe have been brought up to fear insects. We regard them as unnecessary creatures that do more harm than good.\n\nWe continually wage war on them, for they contaminate our food, carry diseases, or devour our crops.\n\nThey sting or bite without provocation. They fly uninvited into our rooms on summer nights, or beat against our lighted windows.\n\nWe live in dread not only of unpleasant insects like spiders or wasps, but of quite harmless ones like moths.\n\nReading about them increases our understanding without dispelling our fears.\n\nKnowing that the industrious ant lives in a highly organized society does nothing to prevent us from being filled with revulsion when we find hordes of them crawling over a carefully prepared picnic lunch.\n\nNo matter how much we like honey, or how much we have read about the uncanny sense of direction which bees possess, we have a horror of being stung.\n\nMost of our fears are unreasonable, but they are impossible to erase.\n\nAt the same time, however, insects are strangely fascinating.\n\nWe enjoy reading about them, especially when we find that, like the praying mantis, they lead perfectly horrible lives.\n\nWe enjoy staring at them, entranced as they go about their business, unaware, we hope, of our presence.\n\nWho has not stood in awe at the sight of a spider pouncing on a fly, or a column of ants triumphantly bearing home an enormous dead beetle?\n\nLast summer I spent days in the garden watching thousands of ants crawling up the trunk of my prize peach tree.\n\nThe tree has grown against a warm wall on a sheltered side of the house.\n\nI am especially proud of it, not only because it has survived several severe winters, but because it occasionally produces luscious peaches.\n\nDuring the summer I noticed that the leaves of the tree were beginning to wither.\n\nClusters of tiny insects called aphides were to be found on the underside of the leaves.\n\nThey were visited by a large colony of ants, which obtained a sort of honey from them.\n\nI immediately embarked on an experiment which, even though it failed to get rid of the ants, kept me fascinated for twenty-four hours.\n\nI bound the base of the tree with sticky tape, making it impossible for the ants to reach the aphides.\n\nThe tape was so sticky that they did not dare to cross it.\n\nFor a long time I watched them scurrying around the base of the tree in bewilderment.\n\nI even went out at midnight with a torch and noted with satisfaction and surprise that the ants were still swarming around the sticky tape without being able to do anything about it.\n\nI got up early next morning, hoping to find that the ants had given up in despair.\n\nInstead, I saw that they had discovered a new route.\n\nThey were climbing up the wall of the house and then on to the leaves of the tree.\n\nI realized, sadly, that I had been completely defeated by their ingenuity.\n\nThe ants had been quick to find an answer to my thoroughly unscientific methods."},{"id":"book-3-lesson-55","bookNumber":3,"number":55,"title":"From the earth: Greetings","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-055-from-the-earth-greetings-45223761/","text":"Lesson 55. From the earth: Greetings.\n\nListen to the tape, then answer the question below.\n\nWhich life forms are most likely to develop on a distant planet?\n\nRecent developments in astronomy have made it possible to detect planets in our own Milky Way and in other galaxies.\n\nThis is a major achievement because, in relative terms, planets are very small and do not emit light.\n\nFinding planets is proving hard enough, but finding life on them will prove infinitely more difficult.\n\nThe first question to answer is whether a planet can actually support life.\n\nIn our own solar system, for example, Venus is far to hot and Mars is far too cold to support life.\n\nOnly the Earth provides ideal conditions, and even here it has taken more than four billion years for plant and animal life to evolve.\n\nWhether a planet can support life depends on the size and brightness of its star, that is, its sun.\n\nImagine a star up to twenty times larger, brighter and hotter than our own sun.\n\nA planet would have to be a very long way from it to be capable of supporting life.\n\nAlternatively, if the star were small, the life-supporting planet would have to have a close orbit round it and also provide the perfect conditions for life forms to develop.\n\nBut how would we find such a planet?\n\nAt present, there is no telescope in existence that is capable of detecting the presence of life.\n\nThe development of such a telescope will be one of the great astronomical projects of the 21st century.\n\nIt is impossible to look for life on another planet using Earth-based telescopes.\n\nOur own warm atmosphere and the heat generated by the telescope would make it impossible to detect objects as small as planets.\n\nEven a telescope in orbit round the earth, like the very successful Hubble telescope, would not be suitable because of the dust particles in our solar system.\n\nA telescope would have to be as far away as the planet Jupiter to look for life in outer space, because the dust becomes thinner the further we travel towards the outer edges of our own solar system.\n\nOnce we detected a planet, we would have to find a way of blotting out the light from its star, so that we would be able to 'see' the planet properly and analyse its atmosphere.\n\nIn the first instance, we would be looking for plant life rather than little green men.\n\nThe life forms most likely to develop on a planet would be bacteria.\n\nIt is bacteria that have generated the oxygen we breathe on Earth.\n\nFor most of the Earth's history, they have been the only form of life on our planet.\n\nAs Earth-dwellers, we always cherish the hope that we will be visited by little green men and that we will be able to communicate with them.\n\nBut this hope is always in the realms of science fiction.\n\nIf we were able to discover lowly forms of life like bacteria on another planet, it would completely change our view of ourselves.\n\nAs Daniel Goldin of NASA observed, finding life elsewhere would change everything.\n\nNo human endeavour or thought would be unchanged by it.'"},{"id":"book-3-lesson-56","bookNumber":3,"number":56,"title":"Our neighbour, the river","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-056-our-neighbour-the-river-45223762/","text":"Lesson 56. Our neighbour, the river.\n\nListen to the tape, then answer the question below.\n\nWhy had the neighbours left their farm?\n\nThe river, which forms the eastern boundary of our farm, has always played an important part in our lives.\n\nWithout it, we could not make a living.\n\nThere is only enough spring water to supply the needs of the house, so we have to pump from the river for farm use.\n\nWe tell the river all our secrets.\n\nWe know instinctively, just as beekeepers with their bees, that misfortune might overtake us if the important events of our lives were not related to it.\n\nWe have special river birthday parties in the summer.\n\nSometimes we go upstream to a favourite backwater, Sometimes we have our party at the boathouse, which a predecessor of ours at the farm built in the meadow hard by the deepest pool for swimming and diving.\n\nIn a heat wave, we choose a midnight birthday party, and that is the most exciting of all.\n\nWe welcome the seasons by the riverside, crowning the youngest girl with flowers in the spring, holding a summer festival on midsummer eve, giving thanks for the harvest in the autumn, and throwing a holly wreath into the current in the winter.\n\nAfter a long period of rain, the river may overflow its banks.\n\nThis is a rare occurrence, as our climate seldom goes to extremes.\n\nWe are lucky in that only the lower fields, which make up a very small proportion of our farm, are affected by flooding. but other farms are less favourably sited, and flooding can sometimes spell disaster for their owners.\n\nOne bad winter, we watched the river creep up the lower meadows.\n\nAll the cattle had been moved into stalls, and we stood to lose little.\n\nWe were, however, worried about our nearest neighbours, whose farm was low lying and who were newcomers to the district.\n\nAs the floods had put the telephone out of order, we could not find out how they were managing.\n\nFrom an attic window, we could get a sweeping view of the river where their land joined ours, and at the most critical juncture, we took turns in watching that point.\n\nThe first sign of disaster was a dead sheep floating down.\n\nNext came a horse, swimming bravely, but we were afraid that the strength of the current would prevent its landing anywhere before it became exhausted.\n\nSuddenly, a raft appeared, looking rather like Noah's Ark, carrying the whole family, a few hens, the dogs, a cat, and a bird in a cage.\n\nWe realized that they must have become unduly frightened by the rising flood, for their house, which had sound foundations, would have stood stoutly even if it had been almost submerged.\n\nThe men of our family waded down through our flooded meadows with boat hooks, in the hope of being able to grapple a corner of the raft and pull it out of the current towrds our bank.\n\nWe still think it a miracle that they were able to do so."},{"id":"book-3-lesson-57","bookNumber":3,"number":57,"title":"Back in the old country","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-057-back-in-the-old-country-45223763/","text":"Lesson 57. Back in the old country.\n\nListen to the tape, then answer the question below.\n\nDid the narrator find his mother's grave?\n\nI stopped to let the car cool off and to study the map.\n\nI had expected to be near my objective by now, but everything still seemed alien to me.\n\nI was only five when my father had taken me abroad, and that was eighteen years ago.\n\nWhen my mother had died after a tragic accident, he did not quickly recover from the shock and loneliness.\n\nEverything around him was full of her presence, continually reopening the wound, so he decided to emigrate.\n\nIn the new country, he became absorbed in making a new life for the two of us, so that he gradually ceased to grieve.\n\nHe did not marry again, and I was brought up without a woman's care.\n\nBut I lacked for nothing, for he was both father and mother to me.\n\nHe always meant to go back one day, but not to stay.\n\nHis roots and mine had become too firmly embedded in the new land.\n\nBut he wanted to see the old folk again and to visit my mother's grave.\n\nHe became mortally ill a few months before we had planned to go, and when he knew that he was dying, he made me promise to go on my own.\n\nI hired a car the day after landing, and bought a comprehensive book of maps, which I found most helpful on the cross-country journey, but which I did not think I should need on the last stage.\n\nIt was not that I actually remembered anything at all.\n\nBut my father had described over and over again what we should see at every milestone, after leaving the nearest town, so that I was positive I should recognize it as familiar territory.\n\nWell, I had been wrong, for I was now lost.\n\nI looked at the map, and then at the milometer.\n\nI had come ten miles since leaving the town, and at this point, according to my father, I should be looking at farms and cottages in a valley, with the spire of the church of our village showing in the far distance.\n\nI could see no valley, no farms, no cottages and no church spire -- only a lake.\n\nI decided that I must have taken a wrong turning somewhere.\n\nSo I drove back to the town and began to retrace the route, taking frequent glances at the map.\n\nI landed up at the same corner.\n\nThe curious thing was that the lake was not marked on the map.\n\nI felt as if I had stumbled into a nightmare country, as you sometimes do in dreams.\n\nAnd, as in a nightmare, there was nobody in sight to help me.\n\nFortunately for me, as I was wondering what to do next, there appeared on the horizon a man on horseback, riding in my direction.\n\nI waited till he came near.\n\nThen I asked him the way to our old village.\n\nHe said that there was now no village.\n\nI thought he must have misunderstood me, so I repeated its name.\n\nThis time he pointed to the lake.\n\nThe village no longer existed because it had been submerged, and all the valley too.\n\nThe lake was not a natural one, but a man-made reservoir."},{"id":"book-3-lesson-58","bookNumber":3,"number":58,"title":"A spot of bother","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-058-a-spot-of-bother-45223764/","text":"Lesson 58. A spot of bother.\n\nListen to the tape, then answer the question below.\n\nWhat did the old lady find when she got home?\n\nThe old lady was glad to be back at the block of flats where she lived.\n\nHer shopping had tired her, and her basket had grown heavier with every step of the way home.\n\nIn the lift, her thoughts were on lunch and a good rest.\n\nBut when she got out at her own floor, both were forgotten in her sudden discovery that her front door was open.\n\nShe was thinking that she must reprimand her home help the next morning for such a monstrous piece of negligence, when she remembered that she had gone shopping after the home help had left, and she knew that she had turned both keys in their locks.\n\nShe walked slowly into the hall and at once noticed that all the room doors were open.\n\nYet following her regular practice, she had shut them before going out.\n\nLooking into the drawing room, she saw a scene of confusion over by her writing desk.\n\nIt was as clear as daylight, then, that burglars had forced an entry during her absence.\n\nHer first impulse was to go round all the rooms looking for the thieves.\n\nBut then she decided that at her age it might be more prudent to have someone with her.\n\nSo she went to fetch the porter from his basement.\n\nBy this time her legs were beginning to tremble.\n\nSo she sat down and accepted a cup of very strong tea while he telephoned the police.\n\nThen, her composure regained, she was ready to set off with the porter's assistance to search for any intruders who might still be lurking in her flat.\n\nThey went through the rooms, being careful to touch nothing, as they did not want to hinder the police in their search for fingerprints.\n\nThe chaos was inconceivable.\n\nShe had lived in the flat for thirty years and was a veritable magpie at hoarding.\n\nAnd it seemed as though everything she possessed had been tossed out and turned over and over.\n\nAt least sorting out the things she should have discarded years ago was now being made easier for her.\n\nThen a police inspector arrived with a constable and she told them of her discovery of the ransacked flat.\n\nThe inspector began to look for fingerprints, while the constable checked that the front door locks had not been forced, thereby proving that the burglars had either used skeleton keys or entered over the balcony.\n\nThere was no trace of fingerprints.\n\nBut the inspector found a dirty red bundle that contained jewellery, which the old lady said was not hers.\n\nSo their entry into this flat was apparently not the burglars' first job that day and they must have been disturbed.\n\nThe inspector then asked the old lady to try to check what was missing by the next day, and advised her not to stay alone in the flat for a few nights.\n\nThe old lady thought he was a fussy creature, but since the porter agreed with him, she rang up her daughter and asked for her help in what she described as a little spot of bother."},{"id":"book-3-lesson-59","bookNumber":3,"number":59,"title":"Collecting","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-059-collecting-45223766/","text":"Lesson 59. Collecting.\n\nListen to the tape, then answer the question below.\n\nWhat in particular does a person gain when he or she becomes a serious collector?\n\nPeople tend to amass possessions, sometimes without being aware of doing so.\n\nIndeed, they can have a delightful surprise when they find something useful which they did not know they owned.\n\nThose who never have to move house become indiscriminate collectors of what can only be described as clutter.\n\nThey leave unwanted objects in drawers, cupboards and attics for years, in the belief that they may one day need just those very things.\n\nAs they grow old, people also accumulate belongings for two other reasons, lack of physical and mental energy, both of which are essential in turning out and throwing away, and sentiment.\n\nThings owned for a long time are full of associations with the past, perhaps with relatives who are dead, and so they gradually acquire a value beyond their true worth.\n\nSome things are collected deliberately in the home in an attempt to avoid waste.\n\nAmong these, I would list string and brown paper, kept by thrifty people when a parcel has been opened, to save buying these two requisites.\n\nCollecting small items can easily become a mania.\n\nI know someone who always cuts sketches out from newspapers of model clothes that she would like to buy if she had the money.\n\nAs she is not rich, the chances that she will ever be able to afford such purchases are remote.\n\nBut she is never sufficiently strong-minded to be able to stop the practice.\n\nIt is a harmless habit, but it litters up her desk to such an extent that every time she opens it, loose bits of paper fall out in every direction.\n\nCollecting as a serious hobby is quite different and has many advantages.\n\nIt provides relaxation for leisure hours, as just looking at one's treasures is always a joy.\n\nOne does not have to go outside for amusement, since the collection is housed at home.\n\nWhatever it consists of, stamps, records, first editions of books, china, glass, antique furniture, pictures, model cars, stuffed birds, toy animals, there is always something to do in connection with it, from finding the right place for the latest edition, to verifying facts in reference books.\n\nThis hobby educates one not only in the chosen subject, but also in general matters, which have some bearing on it.\n\nThere are also other benefits.\n\nOne wants to meet like-minded collectors, to get advice, to compare notes, to exchange articles, to show off the latest find.\n\nSo one circle of friends grows.\n\nSoon the hobby leads to travel, perhaps to a meeting in another town, possibly a trip abroad in search of a rare specimen, for collectors are not confined to any one country.\n\nOver the years, one may well become an authority on one's hobby, and will very probably be asked to give informal talks to little gatherings, and then, if successful, to larger audiences.\n\nIn this way, self-confidence grows, first from mastering a subject, then from being able to talk about it.\n\nCollecting, by occupying spare time so constructively, makes a person contented, with no time for boredom."},{"id":"book-3-lesson-60","bookNumber":3,"number":60,"title":"Too early and too late","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-060-too-early-and-too-late-45223767/","text":"Lesson 60. Too early and too late.\n\nListen to the tape, then answer the question below.\n\nWhy did the young girl miss the train?\n\nPunctuality is a necessary habit in all public affairs in civilized society.\n\nWithout it, nothing could ever be brought to a conclusion.\n\nEverything would be in a state of chaos.\n\nOnly in a sparsely-populated rural community is it possible to disregard it.\n\nIn ordinary living, there can be some tolerance of unpunctuality.\n\nThe intellectual, who is working on some abstruse problem, has everything coordinated and organized for the matter in hand.\n\nHe is therefore forgiven if late for a dinner party.\n\nBut people are often reproached for unpunctuality, when their only fault is cutting things fine.\n\nIt is hard for energetic, quick-minded people to waste time, so they are often tempted to finish a job before setting out to keep an appointment.\n\nIf no accidents occur on the way, like punctured tyres, diversions of traffic, sudden descent of fog, they will be on time.\n\nThey are often more industrious, useful citizens than those who are never late.\n\nThe over-punctual can be as much a trial to others as the unpunctual.\n\nThe guest who arrives half an hour too soon is the greatest nuisance.\n\nSome friends of my family had this irritating habit.\n\nThe only thing to do was ask them to come half an hour later than the other guests.\n\nThen they arrived just when we wanted them.\n\nIf you are catching a train, it is always better to be comfortably early than even a fraction of a minute too late.\n\nAlthough being early may mean wasting a little time, this will be less than if you miss the train and have to wait an hour or more for the next one, and you avoid the frustration of arriving at the very moment when the train is drawing out of the station and being unable to get on it.\n\nAn even harder situation is to be on the platform in good time for a train and still to see it go off without you.\n\nSuch an experience befell a certain young girl the first time she was travelling alone.\n\nShe entered the station twenty minutes before the train was due.\n\nSince her parents had impressed upon her that it would be unforgivable to miss it and cause the friends with whom she was going to stay to make two journeys to meet her.\n\nShe gave her luggage to a porter and showed him her ticket.\n\nTo her horror, he said that she was two hours too soon.\n\nShe felt in her handbag for the piece of paper on which her father had written down all the details of the journey and gave it to the porter.\n\nHe agreed that a train did come into the station at the time on the paper and that it did stop, but only to take on mail, not passengers.\n\nThe girl asked to see a timetable, feeling sure that her father could not have made such a mistake.\n\nThe porter went to fetch one and arrived back with the station master, who produced it with a flourish and pointed out a microscopic O beside the time of the arrival of the train at his station.\n\nThis little O indicated that the train only stopped for mail.\n\nJust as that moment the train came into the station.\n\nThe girl, tears streaming down her face, begged to be allowed to slip into the guard's van.\n\nBut the station master was adamant.\n\nRules could not be broken.\n\nAnd she had to watch that train disappear towards her destination while she was left behind."}]},{"number":4,"title":"New Concept English 4","subtitle":"Fluency in English","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/","lessons":[{"id":"book-4-lesson-1","bookNumber":4,"number":1,"title":"Finding Fossil Man","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-001-finding-fossil-man-45515419/","text":"Lesson 1. Finding Fossil Man.\n\nFirst listen and then answer the following question.\n\nWhy are legends handed down by storytellers useful?\n\nWe can read of things that happened 5,000 years ago in the Near East, where people first learned to write.\n\nBut there are some parts of the world where even now people cannot write.\n\nThe only way that they can preserve their history is to recount it as sagas, legends handed down from one generation of storytellers to another.\n\nThese legends are useful because they can tell us something about migrations of people who lived long ago.\n\nBut none could write down what they did.\n\nAnthropologists wondered where the remote ancestors of the Polynesian peoples now living in the Pacific Islands came from.\n\nThe sagas of these people explain that some of them came from Indonesia about 2,000 years ago.\n\nBut the first people who were like ourselves lived so long ago that even their sagas, if they had any, are forgotten.\n\nSo archaeologists have neither history nor legends to help them to find out where the first modern men came from.\n\nFortunately, however, ancient men made tools of stone, especially flint, because this is easier to shape than other kinds.\n\nThey may also have used wood and skins, but these have rotted away.\n\nStone does not decay, and so the tools of long ago have remained.\n\nwhen even the bones of the men who made them have disappeared without trace."},{"id":"book-4-lesson-2","bookNumber":4,"number":2,"title":"Spare that spider","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-002-spare-that-spider-45516119/","text":"Lesson 2. Spare that spider.\n\nFirst listen and then answer the following question.\n\nHow much of each year do spiders spend killing insects?\n\nWhy, you may wonder, should spiders be our friends?\n\nBecause they destroy so many insects, and insects include some of the greatest enemies of the human race.\n\nInsects would make it impossible for us to live in the world; they would devour all our crops and kill our flocks and herds, if it were not for the protection we get from insect-eating animals.\n\nWe owe a lot to the birds and beasts who eat insects but all of them put together kill only a fraction of the number destroyed by spiders.\n\nMoreover, unlike some of the other insect eaters, spiders never do the least harm to us or our belongings.\n\nSpiders are not insects, as many people think, nor even nearly related to them.\n\nOne can tell the difference almost at a glance, for a spider always has eight legs and an insect never more than six.\n\nHow many spiders are engaged in this work on our behalf?\n\nOne authority on spiders made a census of the spiders in a grass field in the south of England, and he estimated that there were more than 2,250,000 in one acre; that is something like 6,000,000 spiders of different kinds on a football pitch.\n\nSpiders are busy for at least half the year in killing insects.\n\nIt is impossible to make more than the wildest guess at how many they kill, but they are hungry creatures, not content with only three meals a day.\n\nIt has been estimated that the weight of all the insects destroyed by spiders in Britain in one year would be greater than the total weight of all the human beings in the country."},{"id":"book-4-lesson-3","bookNumber":4,"number":3,"title":"Matterhorn man","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-003-matterhorn-man-45519282/","text":"Lesson 3. Matterhorn man.\n\nFirst listen and then answer the following question.\n\nWhat was the main objective of early mountain climbers?\n\nModern alpinists try to climb mountains by a route which will give them good sport, and the more difficult it is, the more highly it is regarded.\n\nIn the pioneering days however, this was not the case at all.\n\nThe early climbers were looking for the easiest way to the top because the summit was the prize they sought, especially if it had never been attained before.\n\nIt is true that during their explorations they often faced difficulties and dangers of the most perilous nature, equipped in a manner which would make a modern climber shudder at the thought, but they did not go out of their way to court such excitement.\n\nThey had a single aim, a solitary goal -- the top!\n\nIt is hard for us to realize nowadays how difficult it was for the pioneers.\n\nExcept for one or two places such as Zermatt and Chamonix, which had rapidly become popular.\n\nAlpine villages tended to be impoverished settlements cut off from civilization by the high mountains.\n\nSuch inns as there were were generally dirty and flea-ridden; the food simply local cheese accompanied by bread often twelve months old, all washed down with coarse wine.\n\nOften a valley boasted no inn at all, and climbers found shelter wherever they could-- sometimes with the local priest(who was usually as poor as his parishioners), sometimes with shepherds or cheese-makers.\n\nInvariably the background was the same: dirt and poverty, and very uncomfortable.\n\nFor men accustomed to eating seven-course dinners and sleeping between fine linen sheets at home, the change to the Alps must have been very hard indeed."},{"id":"book-4-lesson-4","bookNumber":4,"number":4,"title":"Seeing Hands","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-004-seeing-hands-45519284/","text":"Lesson 4. Seeing Hands.\n\nFirst listen and then answer the following question.\n\nHow did Vera discover she had this gift of second sight?\n\nSeveral cases have been reported in Russia recently of people who can read and detect colors with their fingers and even see through solid doors and walls.\n\nOne case concerns an 11-year-old schoolgirl, Vera Petrova, who has normal vision but who can also perceive things with different parts of her skin and through solid walls.\n\nThis ability was first noticed by her father.\n\nOne day, she came into his office and happened to put her hands on the door of a locked safe.\n\nSuddenly, she asked her father why he kept so many old newspapers locked away there, and even described the way they were done up in bundles.\n\nVera's curious talent was brought to the notice of a scientific research institute in the town of Ulanowsk, near where she lives.\n\nAnd in April, she was given a series of tests by a special commission of the Ministry of Health of the Russian Federal Republic.\n\nDuring these tests, she was able to read a newspaper through an opaque screen, and, stranger still, by moving her elbow over a child's game of lotto, she was able to describe the figures and colours printed on it, and, in another instance, wearing stockings and slippers, to make out with her foot the outlines and colours of a picture hidden under a carpet.\n\nOther experiments showed that her knees and shoulders had a similar sensitivity.\n\nDuring all these tests, Vera was blindfold, and indeed, except when blindfold, she lacked the ability to perceive things with her skin.\n\nIt was also found that although she could perceive things with her fingers, this ability ceased the moment her hands were wet."},{"id":"book-4-lesson-5","bookNumber":4,"number":5,"title":"Youth","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-005-youth-45519286/","text":"Lesson 5. Youth.\n\nFirst listen and then answer the following question.\n\nHow does the writer like to treat young people?\n\nPeople are always talking about the problem of youth.\n\nIf there is one, which I take leave to doubt, then it is older people who create it, not the young themselves.\n\nLet us get down to fundamentals and agree that the young are, after all, human beings, people just like their elders.\n\nThere is only one difference between an old man and a young one.\n\nThe young man has a glorious future before him, and the old one has a splendid future behind him, and maybe that is where the rub is.\n\nWhen I was a teenager, I felt that I was just young and uncertain, that I was a new boy in a huge school, and I would have been very pleased to be regarded as something so interesting as a problem.\n\nFor one thing, being a problem gives you a certain identity, and that is one of the things the young are busily engaged in seeking.\n\nI find young people exciting.\n\nThey have an air of freedom, and they have not a dreary commitment to mean ambitions or love of comfort.\n\nThey are not anxious social climbers, and they have no devotion to material things.\n\nAll this seems to me to link them with life and the origins of things.\n\nIt's as if they were, in some sense, cosmic beings in violent and lovely contrast with us suburban creatures.\n\nAll that is in my mind when I meet a young person.\n\nHe may be conceited, ill-mannered, presumptuous, or fatuous, but I do not turn for protection to dreary clichés about respect for elders, as if mere age were a reason for respect.\n\nI accept that we are equals, and I will argue with them as an equal if I think he is wrong."},{"id":"book-4-lesson-6","bookNumber":4,"number":6,"title":"The Sporting Spirit","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-006-the-sporting-spirit-45519288/","text":"Lesson 6. The Sporting Spirit.\n\nFirst listen and then answer the following question.\n\nHow does the writer describe sport at the international level?\n\nI am always amazed when I hear people saying that sport creates goodwill between the nations, and that if only the common peoples of the world could meet one another at football or cricket, they would have no inclination to meet on the battlefield.\n\nEven if one didn't know from concrete examples, the 1936 Olympic Games for instance, that international sporting contests lead to orgies of hatred, one could deduce it from general principles.\n\nNearly all the sports practiced nowadays are competitive.\n\nYou play to win, and the game has little meaning unless you do your utmost to win.\n\nOn the village green, where you pick up sides and no feeling of local patriotism is involved, it is possible to play simply for the fun and exercise.\n\nBut as soon as the question of prestige arises, As soon as you feel that you and some larger unit will be disgraced if you lose, the most savage combative instincts are aroused.\n\nAnyone who has played even in a school football match knows this.\n\nAt the international level, sport is frankly mimic warfare.\n\nBut the significant thing is not the behavior of the players, but the attitude of the spectators.\n\nAnd behind the spectators of the nations who work themselves into furies over these absurd contests and seriously believe, at any rate for short periods, that running, jumping, and kicking a ball are tests of national virtue."},{"id":"book-4-lesson-7","bookNumber":4,"number":7,"title":"Bats","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-007-bats-45519290/","text":"Lesson 7. Bats.\n\nFirst listen and then answer the following question.\n\nIn what way does echo-location in bats play an utilitarian role?\n\nNot all sounds made by animals serve as language, and we have only to turn to that extraordinary discovery of echo-location in bats to see a case in which the voice plays a strictly utilitarian role.\n\nTo get a full appreciation of what this means we must turn first to some recent human inventions.\n\nEveryone knows that if he shouts in the vicinity of a wall or a mountainside, an echo will come back.\n\nThe further off this solid obstruction, the longer time will elapse for the return of the echo.\n\nA sound made by tapping on the hull of a ship will be reflected from the sea bottom, and by measuring the time interval between the taps and the receipt of the echoes the depth of the sea at that point can be calculated.\n\nSo was born the echo-sounding apparatus, now in general use in ships.\n\nEvery solid object will reflect a sound, varying according to the size and nature of the object.\n\nA shoal of fish will do this.\n\nSo it is a comparatively simple step from locating the sea bottom to locating a shoal of fish.\n\nWith experience, and with improved apparatus, it is now possible not only to locate a shoal but to tell if it is herring, cod, or other well-known fish, by the pattern of its echo.\n\nIt has been found that certain bats emit squeaks and by receiving the echoes, they can locate and steer clear of obstacles -- or locate flying insects on which they feed.\n\nThis echo-location in bats is often compared with radar, the principle of which is similar."},{"id":"book-4-lesson-8","bookNumber":4,"number":8,"title":"Trading Standards","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-008-trading-standards-45519294/","text":"Lesson 8. Trading Standards.\n\nFirst listen and then answer the following question.\n\nWhat makes trading between rich countries difficult?\n\nChickens slaughtered in the United States, claim officials in Brussels, are not fit to grace European tables.\n\nNo, say the Americans.\n\nOur fowl are fine.\n\nWe simply clean them in a different way.\n\nThese days, it is differences in national regulations far more than tariffs that put sand in the wheels of trade between rich countries.\n\nIt is not just farmers who are complaining.\n\nAn electric razor that meets the European Union safety standards must be approved by American testers before it can be sold in the United States.\n\nAnd an American-made dialysis machine needs the EU's OK before it hits the market in Europe.\n\nAs it happens, a razor that is safe in Europe is unlikely to electrocute Americans.\n\nSo, ask businesses on both sides of the Atlantic, why have two lots of tests where one would do?\n\nPoliticians agree, in principle, so America and the EU have been trying to reach a deal which would eliminate the need to double-test many products.\n\nThey hope to finish in time for a trade summit between America and the EU on May 28th.\n\nAlthough negotiators are optimistic, the details are complex enough that they may be hard-pressed to get a deal at all.\n\nWhy?\n\nOne difficulty is to construct the agreements.\n\nThe Americans would happily reach one accord on standards for medical devices and then hammer out different packs covering, say, electronic goods and drug manufacturing.\n\nThe EU, following fine continental traditions wants agreement on general principles, which could be applied to many types of products and perhaps extended to other countries."},{"id":"book-4-lesson-9","bookNumber":4,"number":9,"title":"Royal Espionage","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-009-royal-espionage-45519296/","text":"Lesson 9. Royal Espionage.\n\nFirst listen and then answer the following question.\n\nWhat important thing did King Alfred learn when he penetrated the Danish camp of Guthrum?\n\nAlfred the Great acted as his own spy, visiting Danish camps disguised as a minstrel.\n\nIn those days, wandering minstrels were welcome everywhere.\n\nThey were not fighting men, and their harp was their passport.\n\nAlfred had learned many of their ballads in his youth, and could vary his program with acrobatic tricks and simple conjuring.\n\nWhile Alfred's little army slowly began to gather at Alphenley, the king himself set out to penetrate the camp of Guthrum, the commander of the Danish invaders.\n\nThese had settled down for the winter at Chippenham.\n\nThither Alfred went.\n\nHe noticed that once the discipline was slack.\n\nThe Danes had the self-confidence of conquerors, and their security precautions were casual.\n\nThey lived well on the proceeds of raids on neighboring regions.\n\nThere they collected women as well as food and drink, and a life of ease had made them soft.\n\nAlfred stayed in the camp a week before he returned to Athenley.\n\nThe force there assembled was trivial compared with the Danish horde, but Alfred had deduced that the Danes were no longer fit for prolonged battle and that their commissariat had no organization but depended on irregular raids.\n\nSo, faced with a Danish advance, Alfred did not risk open battle, but harried the enemy.\n\nHe was constantly on the move, drawing the Danes after him.\n\nHis patrols halted the raiding parties.\n\nHunger assailed the Danish army.\n\nNow Alfred began a long series of skirmishes, and within a month the Danes had surrendered.\n\nThe episode could reasonably serve as a unique epic of royal espionage."},{"id":"book-4-lesson-10","bookNumber":4,"number":10,"title":"Silicon Valley","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-010-silicon-valley-45519300/","text":"Lesson 10. Silicon Valley.\n\nFirst listen and then answer the following question.\n\nWhat does the computer industry thrive on apart from anarchy?\n\nTechnology trends may push Silicon Valley back to the future.\n\nCarver Mead, a pioneer in integrated circuits and a professor of computer science at the California Institute of Technology, notes that there are now workstations that enable engineers to design, test, and produce chips right on their desks, much the way an editor creates a newsletter on a Macintosh.\n\nAs the time and cost of making a chip drop to a few days and a few hundred dollars, engineers may soon be free to let their imagination soar without being penalized by expensive failures.\n\nMead predicts that inventors will be able to perfect powerful customized chips over a weekend at the office, spawning a new generation of garage startups and giving the U.S. a jump on its foreign rivals in getting new products to market fast.\n\nWe've got more garages with smart people, Mead observes.\n\nWe really thrive on anarchy.\n\nAnd on Asians, already Orientals and Asian Americans constitute the majority of the engineering staffs at many Valley firms.\n\nAnd Chinese, Korean, Filipino, and Indian engineers are graduating in droves from California's colleges.\n\nAs the heads of next-generation startups, these Asian innovators can draw on customs and languages to forge tighter links with crucial Pacific Rim markets.\n\nFor instance, Alex Au, a Stanford PhD from Hong Kong, has set up a Taiwan factory to challenge Japan's near-lock on the memory chip market.\n\nIndian-born N. Damodar Reddy's Tiny California Company reopened an AT\u0026T chip plant in Kansas City last spring, with financing from the state of Missouri.\n\nBefore it becomes a retirement village, Silicon Valley may prove a classroom for building a global business."},{"id":"book-4-lesson-11","bookNumber":4,"number":11,"title":"How to grow old","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-011-how-to-grow-old-45519302/","text":"Lesson 11. How to grow old.\n\nFirst listen and then answer the following question.\n\nWhat, according to the author, is the best way to overcome the fear of death as you get older?\n\nSome old people are oppressed by the fear of death.\n\nIn the young there is a justification for this feeling.\n\nYoung men who have reason to fear that they will be killed in battle may justifiably feel bitter in the thought that they have been cheated of the best things that life has to offer.\n\nBut in an old man who has known human joys and sorrows, and has achieved whatever work it was in him to do, the fear of death is somewhat abject and ignoble.\n\nThe best way to overcome it -- so at least it seems to me -- is to make your interests gradually wider and more impersonal, until bit by bit the walls of the ego recede, and your life becomes increasingly merged in the universal life.\n\nAn individual human existence should be like a river -- small at first, narrowly contained within its banks, and rushing passionately past boulders and over waterfalls.\n\nGradually the river grows wider, the banks recede, the waters flow more quietly, and in the end, without any visible break, they become merged in the sea, and painlessly lose their individual being.\n\nThe man who, in old age can see his life in this way, will not suffer from the fear of death, since the things he cares for will continue.\n\nAnd if, with the decay of vitality, weariness increases, the thought of rest will be not unwelcome.\n\nI should wish to die while still at work, knowing that others will carry on what I can no longer do, and content in the thought that what was possible has been done."},{"id":"book-4-lesson-12","bookNumber":4,"number":12,"title":"Banks and Their Customers","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-012-banks-and-their-customers-45519304/","text":"Lesson 12. Banks and Their Customers.\n\nFirst listen and then answer the following question.\n\nWhy is there no risk to the customer when a bank prints the customer's name on his checks?\n\nWhen anyone opens a current account at a bank, he is lending the bank money, repayment of which he may demand at any time.\n\nEither in cash or by drawing a check in favor of another person.\n\nPrimarily, the banker-customer relationship is that of debtor and creditor.\n\nWho is which, depending on whether the customer's account is in credit or is overdrawn.\n\nBut, in addition to that basically simple concept, the bank and its customer owe a large number of obligations to one another.\n\nMany of these obligations can give rise to problems and complications, but a bank customer, unlike, say, a buyer of goods, cannot complain that the law is loaded against him.\n\nThe bank must obey its customer's instructions and not those of anyone else.\n\nWhen, for example, a customer first opens an account, he instructs the bank to debit his account only in respect of checks drawn by himself.\n\nHe gives the bank specimens of his signature, and there is a very firm rule that the bank has no right or authority to pay out a customer's money on a check on which its customer's signature has been forged.\n\nIt makes no difference that the forgery may have been a very skillful one.\n\nThe bank must recognize its customer's signature.\n\nFor this reason, there is no risk to the customer in the practice adopted by banks of printing the customer's name on its checks.\n\nIf this facilitates forgery, it is the bank which will lose, not the customer."},{"id":"book-4-lesson-13","bookNumber":4,"number":13,"title":"The search for oil","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-013-the-search-for-oil-45519305/","text":"Lesson 13. The search for oil.\n\nFirst listen and then answer the following question.\n\nWhat do oilmen want to achieve as soon as they strike oil?\n\nThe deepest holes of all are made for oil, and they go down to as much as 25,000 feet.\n\nBut we do not need to send man down to get the oil out, as we must with other mineral deposits.\n\nThe holes are only borings, less than a foot in diameter.\n\nMy particular experience is largely in oil, and the search for oil has done more to improve deep drilling than any other mining activity.\n\nWhen it has been decided where we are going to drill, we put up at the surface an oil derrick.\n\nIt has to be tall because it is like a giant block and tackle and we have to lower into the ground and haul out of the ground great lengths of drill pipe which are rotated by an engine at the top and are fitted with a cutting bit at the bottom.\n\nThe geologist needs to know what rocks the drill has reached, so every so often a sample is obtained with a coring bit.\n\nIt cuts a clean cylinder of rock, from which can be seen the strata the drill has been cutting through.\n\nOnce we get down to the oil, it usually flows to the surface because great pressure either from gas or water, is pushing it.\n\nThis pressure must be under control, and we control it by means of the mud which we circulate down the drill pipe.\n\nWe endeavour to avoid the old, romantic idea of a gusher, which wastes oil and gas.\n\nWe want it to stay down the hole until we can lead it off in a controlled manner."},{"id":"book-4-lesson-14","bookNumber":4,"number":14,"title":"The Butterfly Effect","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-014-the-butterfly-effect-45519308/","text":"Lesson 14. The Butterfly Effect.\n\nFirst listen and then answer the following question.\n\nWhy do small errors make it impossible to predict the weather system with a high degree of accuracy?\n\nBeyond two or three days, the world's best weather forecasts are speculative, and beyond six or seven, they are worthless.\n\nThe butterfly effect is the reason.\n\nFor small pieces of weather, and to a global forecaster, small can mean thunderstorms and blizzards.\n\nAny prediction deteriorates rapidly.\n\nErrors and uncertainties multiply cascading upward through a chain of turbulent features from dust devils and squalls up to continent-size eddies that only satellites can see.\n\nThe modern weather models work with a grid of points of the order of 60 miles apart and even so some starting data has to be guessed, since ground stations and satellites cannot see everywhere.\n\nBut suppose the Earth could be covered, with sensors spaced one foot apart, rising at one-foot intervals all the way to the top of the atmosphere.\n\nSuppose every sensor gives perfectly accurate readings of temperature, pressure, humidity, and any other quantity a meteorologist would want.\n\nPrecisely at noon, an infinitely powerful computer takes all the data and calculates what will happen at each point at 1201, then 1202, then 1203.\n\nThe computer will still be unable to predict whether Princeton, New Jersey, will have sun or rain on a day one month away.\n\nAt noon, the spaces between the sensors will hide fluctuations that the computer will not know about, tiny deviations from the average.\n\nBy 12.01, those fluctuations will already have created small errors one foot away.\n\nSoon the errors will have multiplied to the 10-foot scale, and so on, up to the size of the globe."},{"id":"book-4-lesson-15","bookNumber":4,"number":15,"title":"Secrecy in industry","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-015-secrecy-in-industry-45519310/","text":"Lesson 15. Secrecy in industry.\n\nFirst listen and then answer the following question.\n\nWhy is secrecy particularly important in the chemical industries?\n\nTwo factors weigh heavily against the effectiveness of scientific research in industry.\n\nOne is the general atmosphere of secrecy in which it is carried out, the other the lack of freedom of the individual research worker.\n\nIn so far as any inquiry is a secret one, it naturally limits all those engaged in carrying it out from effective contact with their fellow scientists either in other countries or in universities, or even, often enough, in other departments of the same firm.\n\nThe degree of secrecy naturally varies considerably.\n\nSome of the bigger firms are engaged in researches which are of such general and fundamental nature that it is a positive advantage to them not to keep them secret.\n\nYet a great many processes depending on such research are sought for with complete secrecy until the stage at which patents can be taken out.\n\nEven more processes are never patented at all but kept as secret processes.\n\nThis applies particularly to chemical industries, where chance discoveries play a much larger part than they do in physical and mechanical industries.\n\nSometimes the secrecy goes to such an extent that the whole nature of the research cannot be mentioned.\n\nMany firms, for instance have great difficulty in obtaining technical or scientific books from libraries because they are unwilling to have their names entered as having taken out such and such a book, for fear the agents of other firms should be able to trace the kind of research they are likely to be undertaking."},{"id":"book-4-lesson-16","bookNumber":4,"number":16,"title":"The Modern City","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-016-the-modern-city-45519312/","text":"Lesson 16. The Modern City.\n\nFirst listen and then answer the following question.\n\nWhat is the author's main argument about the modern city?\n\nIn the organization of industrial life, the influence of the factory upon the physiological and mental state of the workers has been completely neglected.\n\nModern industry is based on the conception of the maximum production at lowest cost, in order that an individual or a group of individuals may earn as much money as possible.\n\nIt has expanded without any idea of the true nature of the human beings who run the machines, and without giving any consideration to the effects produced on the individuals and on their descendants by the artificial mode of existence imposed by the factory.\n\nThe great cities have been built with no regard for us.\n\nThe shape and dimensions of the skyscrapers depend entirely on the necessity of obtaining the maximum income per square foot of ground and of offering to the tenants offices and apartments that please them.\n\nThis caused the construction of gigantic buildings, where two large masses of human beings are crowded together.\n\nCivilized men like such a way of living.\n\nWhile they enjoy the comfort and banal luxury of their dwelling, they do not realize that they are deprived of the necessities of life.\n\nThe modern city consists of monstrous edifices and of dark, narrow streets full of petrol and toxic gases, torn by the noise of the taxi cabs, lorries, and buses, and thronged ceaselessly by great crowds.\n\nObviously, it has not been planned for the good of its inhabitants."},{"id":"book-4-lesson-17","bookNumber":4,"number":17,"title":"A man-made disease","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-017-a-man-made-disease-45519317/","text":"Lesson 17. A man-made disease.\n\nFirst listen and then answer the following question.\n\nWhat factor helped to spread the disease of myxomatosis?\n\nIn the early days of the settlement of Australia, enterprising settlers unwisely introduced the European rabbit.\n\nThis rabbit had no natural enemies in the Antipodes, so that it multiplied with that promiscuous abandon characteristic of rabbits.\n\nIt overran a whole continent.\n\nIt caused devastation by burrowing and by devouring the herbage which might have maintained millions of sheep and cattle.\n\nScientists discovered that this particular variety of rabbit (and apparently no other animal) was susceptible to a fatal virus disease, myxomatosis.\n\nBy infecting animals and letting them loose in the burrows, local epidemics of this disease could be created.\n\nLater it was found that there was a type of mosquito which acted as the carrier of this disease and passed it on to the rabbits.\n\nSo while the rest of the world was trying to get rid of mosquitoes, Australia was encouraging this one.\n\nIt effectively spread the disease all over the continent and drastically reduced the rabbit population.\n\nIt later became apparent that rabbits were developing a degree of resistance to this disease, so that the rabbit population was unlikely to be completely exterminated.\n\nThere were hopes, however, that the problem of the rabbit would become manageable.\n\nIronically, Europe, which had bequeathed the rabbit as a pest to Australia, acquired this man-made disease as a pestilence.\n\nA French physician decided to get rid of the wild rabbits on his own estate and introduced myxomatosis.\n\nIt did not, however, remain within the confines of this estate.\n\nIt spread through France, where wild rabbits are not generally regarded as a pest but as a sport and a useful food supply, and it spread to Britain where wild rabbits are regarded as a pest but where domesticated rabbits, equally susceptible to the disease, are the basis of a profitable fur industry.\n\nThe question became one of whether Man could control the disease he had invented."},{"id":"book-4-lesson-18","bookNumber":4,"number":18,"title":"Porpoises","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-018-porpoises-45519318/","text":"Lesson 18. Porpoises.\n\nFirst listen and then answer the following question.\n\nWhat would you say is the main characteristic of porpoises?\n\nThere has long been a superstition among mariners that porpoises will save drowning men by pushing them to the surface, or protect them from sharks by surrounding them in defensive formation.\n\nMarine Studio biologists have pointed out that, however intelligent they may be, it is probably a mistake to credit dolphins with any motive of life-saving.\n\nOn the occasions when they have pushed to shore an unconscious human being they have much more likely done it out of curiosity or for sport, as in riding the bow waves of a ship.\n\nIn 1928 some porpoises were photographed working like beavers to push ashore a waterlogged mattress.\n\nIf, as has been reported, they have protected humans from sharks, it may have been because curiosity attracted them and because the scent of a possible meal attracted the sharks.\n\nPorpoises and sharks are natural enemies.\n\nIt is possible that upon such an occasion a battle ensued, with the sharks being driven away or killed.\n\nWhether it be bird, fish or beast, the porpoise is intrigued with anything that is alive.\n\nThey are constantly after the turtles, who peacefully submit to all sorts of indignities.\n\nOne young calf especially enjoyed raising a turtle to the surface with his snout, and then shoving him across the tank like an aquaplane.\n\nAlmost any day a young porpoises may be seen trying to turn a 300-pound sea turtle over by sticking his snout under the edge of his shell and pushing up for dear life.\n\nThis is not easy, and may require two porpoises working together.\n\nIn another game, as the turtle swims across the oceanarium, the first porpoise swoops down from above and butts his shell with his belly.\n\nThis knocks the turtle down several feet.\n\nHe no sooner recovers his equilibrium than the next porpoises comes along and hits him another crack.\n\nEventually the turtle has been butted all the way down to the floor of the tank.\n\nHe is now satisfied merely to try to stand up, but as soon as he does so a porpoise knocks him flat.\n\nThe turtle at last gives up by pulling his feet under his shell and the game is over."},{"id":"book-4-lesson-19","bookNumber":4,"number":19,"title":"The stuff of dreams","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-019-the-stuff-of-dreams-45519322/","text":"Lesson 19. The stuff of dreams.\n\nFirst listen and then answer the following question.\n\nWhat is going on when a person experiences rapid eye-movements during sleep?\n\nIt is fairly clear that the sleeping period must have some function, and because there is so much of it the function would seem to be important.\n\nSpeculations about its nature have been going on for literally thousands of years, and one odd finding that makes the problem puzzling is that it looks very much as if sleeping is not simply a matter of giving the body a rest.\n\n'Rest', in terms of muscle relaxation and so on, can be achieved by a brief period lying, or even sitting down.\n\nThe body's tissues are self-repairing and self-restoring to a degree, and function best when more or less continuously active.\n\nIn fact a basic amount of movement occurs during sleep which is specifically concerned with preventing muscle inactivity.\n\nIf it is not a question of resting the body, then perhaps it is the brain that needs resting?\n\nThis might be a plausible hypothesis were it not for two factors.\n\nFirst the electroencephalograph (which is simply a device for recording the electrical activity of the brain by attaching electrodes to the scalp) shows that while there is a change in the pattern of activity during sleep, there is no evidence that the total amount of activity is any less.\n\nThe second factor is more interesting and more fundamental.\n\nSome years ago an American psychiatrist named William Dement published experiments dealing with the recording of eye-movements during sleep.\n\nHe showed that the average individual's sleep cycle is punctuated with peculiar bursts of eye-movements, some drifting and slow, others jerky and rapid.\n\nPeople woken during these periods of eye-movements generally reported that they had been dreaming.\n\nWhen woken at other times they reported no dreams.\n\nIf one group of people were disturbed from their eye-movement sleep for several nights on end, and another group were disturbed for an equal period of time but when they were not exhibiting eye-movements, the first group began to show some personality disorders while the others seemed more or less unaffected.\n\nThe implications of all this were that it was not the disturbance of sleep that mattered, but the disturbance of dreaming."},{"id":"book-4-lesson-20","bookNumber":4,"number":20,"title":"Snake Poison","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-020-snake-poison-45519324/","text":"Lesson 20. Snake Poison.\n\nFirst listen and then answer the following question.\n\nWhat are the two different ways in which snake poison acts?\n\nHow it came about that snakes manufactured poison is a mystery.\n\nOver the periods, their saliva, a mild digestive juice like our own, was converted into a poison that defies analysis even today.\n\nIt was not forced upon them by the survival competition.\n\nThey could have caught and lived on prey without using poison, just as the thousands of non-poisonous snakes still do.\n\nPoison to a snake is merely a luxury.\n\nIt enables it to get its food with very little effort, no more effort than one bite.\n\nAnd why only snakes?\n\nCats, for instance, would be greatly helped.\n\nNo running fights with large, fierce rats or tussles with grown rabbits.\n\nJust a bite, and no more effort needed.\n\nIn fact, it would be an assistance to all carnivores, though it would be a two-edged weapon when they fought each other.\n\nBut of the vertebrates, unpredictable nature selected only snakes and one lizard.\n\nOne wonders also why nature, with some snakes, concocted poison of such extreme potency.\n\nIn the conversion of saliva into poison, one might suppose that a fixed process took place. It did not.\n\nSome snakes manufactured a poison different in every respect from that of others,as different as arsenic is from strychnine,and having different effects.\n\nOne poison acts on the nerves,the other on the blood.\n\nThe makers of the nerve poison include the mambas and the cobras, and their venom is called neurotoxic.\n\nVipers, adders, and rattlesnakes manufacture the blood poison, which is known as haemolytic.\n\nBoth poisons are unpleasant, but by far the more unpleasant is the blood poison.\n\nIt is said that the nerve poison is the more primitive of the two, that the blood poison is, so to speak, a newer product from an improved formula.\n\nBe that as it may, the nerve poison does its business with man far more quickly than the blood poison.\n\nThis however means nothing.\n\nSnakes did not acquire their poison for use against man but for use against prey such as rats and mice.\n\nAnd the effect on these of the viperine poison is almost immediate."},{"id":"book-4-lesson-21","bookNumber":4,"number":21,"title":"William S.Hart and the early 'Western' film","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-021-william-shart-and-the-early-we-45519325/","text":"Lesson 21. William S.Hart and the early 'Western' film.\n\nFirst listen and then answer the following question.\n\nHow did William Hart's childhood prepare him for his acting role in Western films?\n\nWilliam S.Hart was, perhaps, the greatest of all Western stars, for unlike Gary Cooper and John Wayne he appeared in nothing but Westerns.\n\nFrom 1914 to 1924 he was supreme and unchallenged.\n\nIt was Hart who created the basic formula of the Western film, and devised the protagonist he played in every film he made, the good-bad man, the accidental, noble outlaw, or the honest, but framed cowboy, or the sheriff made suspect by vicious gossip; in short, the individual in conflict with himself and his frontier environment.\n\nUnlike most of his contemporaries in Hollywood, Hart actually knew something of the old West.\n\nHe had lived in it as a child when it was already disappearing, and his hero was firmly rooted in his memories and experiences, and in both the history and the mythology of the vanished frontier.\n\nAnd although no period or place in American history has been more absurdly romanticized, myth and reality did join hands in at least one arena, the conflict between the individual and encroaching civilization.\n\nMen accustomed to struggling for survival against the elements and Indians were bewildered by politicians, bankers and businessmen, and unhorsed by fences, laws and alien taboos.\n\nHart's good-bad man was always an outsider, always one of the disinherited, and if he found it necessary to shoot a sheriff or rob a bank along the way, his early audiences found it easy to understand and forgive, especially when it was Hart who, in the end, overcame the attacking Indians.\n\nAudiences in the second decade of the twentieth century found it pleasant to escape to a time when life, though hard, was relatively simple.\n\nWe still do; living in a world in which undeclared aggression, war, hypocrisy, chicanery, anarchy and impending immolation are part of our daily lives, we all want a code to live by."},{"id":"book-4-lesson-22","bookNumber":4,"number":22,"title":"Knowledge and Progress","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-022-knowledge-and-progress-45519327/","text":"Lesson 22. Knowledge and Progress.\n\nFirst listen and then answer the following question.\n\nIn what two areas have people made no progress at all?\n\nWhy does the idea of progress loom so large in the modern world?\n\nSurely because progress of a particular kind is actually taking place around us and is becoming more and more manifest.\n\nAlthough mankind has undergone no general improvement in intelligence or morality, it has made extraordinary progress in the accumulation of knowledge.\n\nKnowledge began to increase as soon as the thoughts of one individual could be communicated to another by means of speech.\n\nWith the invention of writing, a great advance was made, for knowledge could then be not only communicated but also stored.\n\nLibraries made education possible and education in its turn added to libraries.\n\nThe growth of knowledge followed a kind of compound interest law which was greatly enhanced by the invention of printing.\n\nAll this was comparatively slow until, with the coming of science, the tempo was suddenly raised.\n\nThen knowledge began to be accumulated according to a systematic plan.\n\nThe trickle became a stream.\n\nThe stream has now become a torrent.\n\nMoreover, as soon as new knowledge is acquired, it is now turned to practical account.\n\nWhat is called modern civilization is not the result of a balanced development of all man's nature, but of accumulated knowledge applied to practical life.\n\nThe problem now facing humanity is, what is going to be done with all this knowledge?\n\nAs is so often pointed out, knowledge is a two-edged weapon, which can be used equally for good or evil.\n\nIt is now being used indifferently for both.\n\nCould any spectacle, for instance, be more grimly whimsical than that of gunners using science to shatter men's bodies, while close at hand, surgeons use it to restore them?\n\nWe have to ask ourselves very seriously what will happen if this twofold use of knowledge, with its ever-increasing power, continues."},{"id":"book-4-lesson-23","bookNumber":4,"number":23,"title":"Bird Flight","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-023-bird-flight-45519331/","text":"Lesson 23. Bird Flight.\n\nFirst listen and then answer the following question.\n\nWhat are the two main types of bird flight described by the author?\n\nNo two sorts of birds practice quite the same sort of flight.\n\nThe varieties are infinite, but two classes may be roughly seen.\n\nAny ship that crosses the Pacific is accompanied for many days by the smaller albatross, which may keep company with the vessel for an hour without visible or more than occasional movement of wing.\n\nThe currents of air that the walls of the ship direct upwards, as well as in the line of its course, are enough to give the great bird with its immense wings sufficient sustenance and progress.\n\nThe albatross is the king of the gliders, the class of flyers which harness the air to their purpose, but must yield to its opposition.\n\nIn the contrary school, the duck is supreme.\n\nIt comes nearer to the engines with which man has conquered the air, as he boasts.\n\nDuck, and like them the pigeons, are endowed with steel-like muscles that are a good part of the weight of the bird, and these will ply the short wings with such irresistible power that they can bore for long distances through an opposing gale before exhaustion follows.\n\nTheir humbler followers, such as partridges, have a like power of strong propulsion, but soon tire.\n\nYou may pick them up in utter exhaustion if wind over the sea has driven them to a long journey.\n\nThe swallow shares the virtues of both schools in highest measure.\n\nIt tires not, nor does it boast of its power, but belongs to the air, travelling it may be six thousand miles to and from its northern nesting home, feeding its flown young as it flies, and slipping through a medium that seems to help its passage even when the wind is adverse.\n\nSuch birds do us good, though we no longer take omens from their flight on this side and that, and even the most superstitious villagers no longer take off their hats to the magpie and wish it good morning."},{"id":"book-4-lesson-24","bookNumber":4,"number":24,"title":"Beauty","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-024-beauty-45519332/","text":"Lesson 24. Beauty.\n\nFirst listen and then answer the following question.\n\nWhat do glimpses of beauty, either in nature or art,often suggest to the human mind?\n\nA young man sees a sunset and, unable to understand or to express the emotion that it rouses in him, concludes that it must be the gateway to a world that lies beyond.\n\nIt is difficult for any of us in moments of intense aesthetic experience to resist the suggestion that we are catching a glimpse of a light that shines down to us from a different realm of existence, different and, because the experience is intensely moving, in some way higher.\n\nAnd, though the gleams blind and dazzle, yet do they convey a hint of beauty and serenity greater than we have known or imagined.\n\nGreater too than we can describe; for language, which was invented to convey the meanings of this world cannot readily be fitted to the uses of another.\n\nThat all great art has this power of suggesting a world beyond is undeniable.\n\nIn some moods, nature shares it.\n\nThere is no sky in June so blue that it does not point forward to a bluer, no sunset so beautiful that it does not waken the vision of a greater beauty, a vision which passes before it is fully glimpsed, and in passing leaves an indefinable longing and regret.\n\nBut, if this world is not merely a bad joke, life a vulgar flare amid the cool radiance of the stars, and existence an empty laugh braying across the mysteries; if these intimations of a something behind and beyond are not evil humour born of indigestion, or whimsies sent by the devil to mock and madden us, if, in a word beauty means something yet we must not seek to interpret the meaning.\n\nIf we glimpse the unutterable, it is unwise to try to utter it, nor should we seek to invest with significance that which we cannot grasp.\n\nBeauty in terms of our human meanings is meaningless."},{"id":"book-4-lesson-25","bookNumber":4,"number":25,"title":"Non-Auditory Effects of Noise","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-025-non-auditory-effects-of-noise-45519335/","text":"Lesson 25. Non-Auditory Effects of Noise.\n\nFirst listen and then answer the following question.\n\nWhat conclusion does the author draw about noise and health in this piece?\n\nMany people in industry and the services who have practical experience of noise regard any investigation of this question as a waste of time.\n\nThey are not prepared even to admit the possibility that noise affects people.\n\nOn the other hand, those who dislike noise will sometimes use most inadequate evidence to support their pleas for a quieter society.\n\nThis is a pity, because noise abatement really is a good cause, and it is likely to be discredited if it gets to be associated with bad science.\n\nOne allegation often made is that noise produces mental illness.\n\nA recent article in a weekly newspaper, for instance, was headed with a striking illustration of a lady in a state of considerable distress, with the caption, She was yet another victim, reduced to a screaming wreck.\n\nOn turning eagerly to the text, one learns that the lady was a typist, who found the sound of office typewriters worried her more and more until, eventually, she had to go into a mental hospital.\n\nNow the snag in this sort of anecdote is, of course, that one cannot distinguish cause and effect.\n\nWas the noise a cause of the illness?\n\nOr were the complaints about noise merely a symptom?\n\nAnother patient might equally well complain that her neighbors were combining to slander her and persecute her, and yet one might be cautious about believing this statement.\n\nWhat is needed in the case of noise is a study of large numbers of people living under noisy conditions to discover whether they are mentally ill more often than other people are.\n\nSome time ago, the United States Navy, for instance, examined a very a large number of men working on aircraft carriers.\n\nThe study was known as Project Anihin.\n\nIt can be unpleasant to live even several miles from an aerodrome.\n\nIf you think what it must be like to share the deck of a ship with several squadrons of jet aircraft, you will realize that a modern navy is a good place to study noise.\n\nBut neither psychiatric interviews nor objective tests were able to show any effects upon these American sailors.\n\nThis result merely confirms earlier American and British studies.\n\nIf there is any effect of noise upon mental health, it must be so small that present methods of psychiatric diagnosis cannot find it.\n\nThat does not prove that it does not exist, But it does mean that noise is less dangerous than, say, being brought up in an orphanage, which really is a mental health hazard."},{"id":"book-4-lesson-26","bookNumber":4,"number":26,"title":"The Past Life of the Earth","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-026-the-past-life-of-the-earth-45519337/","text":"Lesson 26. The Past Life of the Earth.\n\nFirst listen and then answer the following question.\n\nWhat is the main condition for the preservation of the remains of any living creature?\n\nIt is animals and plants which lived in or near water whose remains are most likely to be preserved.\n\nFor one of the necessary conditions of preservation is quick burial, and it is only in the seas and rivers, and sometimes lakes, where mud and silt have been continuously deposited, that bodies and the like can be rapidly covered over and preserved.\n\nBut even in the most favorable circumstances, only a small fraction of the creatures that die are preserved in this way before decay sets in or, even more likely, before scavengers eat them.\n\nAfter all, all living creatures live by feeding on something else, whether it be plant or animal, dead or alive, and it is only by chance that such a fate is avoided.\n\nThe remains of plants and animals that lived on land are much more rarely preserved, for there is seldom anything to cover them over.\n\nWhen you think of the innumerable birds that one sees flying about, not to mention the equally numerous small animals like field mice and voles, which you do not see, it is very rarely that one comes across a dead body, except, of course, on the roads.\n\nThey decompose and are quickly destroyed by the weather or eaten by some other creature.\n\nIt is almost always due to some very special circumstances that traces of land animals survive, as by falling into inaccessible caves, or into an ice crevasse, like the Siberian mammoths, when the whole animal is sometimes preserved as in a refrigerator.\n\nThis is what happened to the famous Beresovka mammoth, which was found preserved and in good condition.\n\nIn his mouth were the remains of fir trees, the last meal that he had before he fell into the crevasse and broke his back.\n\nThe mammoth has now been restored in the Paleontological Museum in St. Petersburg.\n\nOther animals were trapped in tar pits, like the elephants, saber-toothed cats, and numerous other creatures that are found at Rancho La Brea, which is now just a suburb of Los Angeles.\n\nApparently what happened was that water collected on these tar pits, and the bigger animals like the elephants ventured out onto the apparently firm surface to drink, and were promptly bogged in the tar.\n\nAnd then, when they were dead, the carnivores, like the saber-toothed cats and the giant wolves, came out to feed and suffered exactly the same fate.\n\nThere are also endless numbers of birds in the tar as well."},{"id":"book-4-lesson-27","bookNumber":4,"number":27,"title":"The 'Vasa'","sourceUrl":"https://www.lingq.com/en/learn-english-online/courses/2811316/4-027-the-vasa-45519342/","text":"Lesson 27. The 'Vasa'.\n\nFirst listen and then answer the following question.\n\nWhat happened to the 'Vasa' almost immediately after she was launched?\n\nFrom the seventeenth-century empire of Sweden, the story of a galleon that sank at the start of her maiden voyage in 1628 must be one of the strangest tales of the sea.\n\nFor nearly three and a half centuries she lay at the bottom of Stockholm harbour until her discovery in 1956.\n\nThis was the Vasa, royal flagship of the great imperial fleet.\n\nKing Gustavus Adolphus 'The Northern Hurricane', then at the height of his military success in the 'Thirty Years' War, had dictated her measurements and armament.\n\nTriple gun-decks mounted sixty-four bronze cannon.\n\nShe was intended to play a leading role in the growing might of Sweden.\n\nAs she was prepared for her maiden voyage on August 10, 1628, Stockholm was in a ferment.\n\nFrom the Skeppsbron and surrounding islands the people watched this thing of beauty begin to spread her sails and catch the wind.\n\nThey had laboured for three years to produce this floating work of art; she was more richly carved and ornamented than any previous ship.\n\nThe high stern castle was a riot of carved gods, demons, knights, kings, warriors, mermaids, cherubs; and zoomorphic animal shapes ablaze with red and gold and blue, symbols of courage, power, and cruelty, were portrayed to stir the imaginations of the superstitious sailors of the day.\n\nThen the cannons of the anchored warships thundered a salute to which the Vasa fired in reply.\n\nAs she emerged from her drifting cloud of gun smoke with the water churned to foam beneath her bow, her flags flying, pennants waving, sails filling in the breeze, and the red and gold or her superstructure ablaze with colour, she presented a more majestic spectacle than Stockholmers had ever seen before.\n\nAll gun-ports were open and the muzzles peeped wickedly from them.\n\nAs the wind freshened there came a sudden squall and the ship made a strange movement, listing to port.\n\nThe Ordnance officer ordered all the port cannon to be heaved to starboard to counteract the list but the steepening angle of the decks increased.\n\nThen the sound of rumbling thunder reached the watchers on the shore, as cargo, ballast, ammunition and 400 people went sliding and crashing down to the port side of the steeply listing ship.\n\nThe lower gun-ports were now below water and the inrush sealed the ship's fate.\n\nIn that first glorious hour, the mighty Vasa, which was intended to rule the
