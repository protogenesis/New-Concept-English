on.\n\nWhy was their disguise too perfect?\n\nAn ancient bus stopped by a dry riverbed and a party of famous actors and actresses got off.\n\nDressed in dark glasses and old clothes, they had taken special precautions so that no one should recognize them.\n\nBut as they soon discovered, disguises can sometimes be too perfect.\n\n\"This is a wonderful place for a picnic,\" said Gloria Gleam.\n\n\"It couldn't be better, Gloria,\" Brinksley Mears agreed.\n\n\"No newspaper men, no film fans! Why don't we come more often?\"\n\nMeanwhile, two other actors, Rockwall Slinger and Merlin Greaves, had carried two large food baskets to a shady spot under some trees.\n\nWhen they had all made themselves comfortable, a stranger appeared.\n\nHe looked very angry.\n\n\"Now you get out of here, all of you!\" he shouted.\n\n\"I'm sheriff here.\"\n\nDo you see that notice?\"\n\nIt says \"No Camping\" — in case you can't read!\"\n\n\"Look, sheriff,\" said Rockwall, \"don't be too hard on us.\"\n\n\"I'm Rockwall Slinger and this is Merlin Greaves.\"\n\n\"Oh, is it?\" said the sheriff with a sneer.\n\n\"Well, I'm Brinksley Mears, and my other name is Gloria Gleam.\"\n\n\"Now you get out of here fast!\""},{"id":"book-2-lesson-75","bookNumber":2,"number":75,"title":"SOS","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-075-sos-45060189/","text":"Lesson 75. SOS.\n\nFirst listen and then answer the question.\n\nHow did the woman get help?\n\nWhen a light passenger plane flew off course some time ago, it crashed in the mountains and its pilot was killed.\n\nThe only passengers, a young woman and her two baby daughters, were unhurt.\n\nIt was the middle of winter.\n\nSnow lay thick on the ground.\n\nThe woman knew that the nearest village was miles away.\n\nWhen it grew dark, she turned a suitcase into a bed and put the children inside it, covering them with all the clothes she could find.\n\nDuring the night, it got terribly cold.\n\nThe woman kept as near as she could to the children and even tried to get into the case herself, but it was too small.\n\nEarly next morning, she heard planes passing overhead and wondered how she could send a signal.\n\nThen she had an idea.\n\nShe stamped out the letters 'SOS' in the snow.\n\nFortunately, a pilot saw the signal and sent a message by radio to the nearest town.\n\nIt was not long before a helicopter arrived on the scene to rescue the survivors of the plane crash."},{"id":"book-2-lesson-76","bookNumber":2,"number":76,"title":"April Fools' Day","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-076-april-fools-day-45060190/","text":"Lesson 76. April Fools' Day.\n\nFirst listen and then answer the question.\n\nWhat was the joke?\n\n'To end our special news bulletin,' said the voice of the television announcer, 'we're going over to the macaroni fields of Calabria.\n\nMacaroni has been grown in this area for over six hundred years.\n\nTwo of the leading growers, Giuseppe Moldova and Riccardo Brabante, tell me that they have been expecting a splendid crop this year and harvesting has begun earlier than usual.\n\nHere you can see two workers who, between them, have just finished cutting three cartloads of golden brown macaroni stalks.\n\nThe whole village has been working day and night gathering and threshing this year's crop before the September rains.\n\nOn the right, you can see Mrs Brabante herself.\n\nShe has been helping her husband for thirty years now.\n\nMrs Brabante is talking to the manager of the local factory where the crop is processed.\n\nThis last scene shows you what will happen at the end of the harvest: the famous Calabrian macaroni-eating competition!\n\nSignor Fratelli, the present champion, has won it every year since 1991.\n\nAnd that ends our special bulletin for today, Thursday, April 1st.\n\nWe're now going back to the studio.'"},{"id":"book-2-lesson-77","bookNumber":2,"number":77,"title":"A successful operation","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-077-a-successful-operation-45060191/","text":"Lesson 77. A successful operation.\n\nFirst listen and then answer the question.\n\nDid the doctors find out how the woman died?\n\nThe mummy of an Egyptian woman who died in 800 B.C.\n\nhas just had an operation.\n\nThe mummy is that of Shepenmut who was once a singer in the Temple of Thebes.\n\nAs there were strange marks on the X-ray plates taken of the mummy, doctors have been trying to find out whether the woman died of a rare disease.\n\nThe only way to do this was to operate.\n\nThe operation, which lasted for over four hours, proved to be very difficult because of the hard resin which covered the skin.\n\nThe doctors removed a section of the mummy and sent it to a laboratory.\n\nThey also found something which the X-ray plates did not show: a small wax figure of the god Duamutef.\n\nThis god which has the head of a cow was normally placed inside a mummy.\n\nThe doctors have not yet decided how the woman died.\n\nThey feared that the mummy would fall to pieces when they cut it open, but fortunately this has not happened.\n\nThe mummy successfully survived the operation."},{"id":"book-2-lesson-78","bookNumber":2,"number":78,"title":"The last one?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-078-the-last-one-45060193/","text":"Lesson 78. The last one?\n\nFirst listen and then answer the question.\n\nFor how long did the writer give up smoking?\n\nAfter reading an article entitled 'Cigarette Smoking and Your Health' I lit a cigarette to calm my nerves.\n\nI smoked with concentration and pleasure as I was sure that this would be my last cigarette.\n\nFor a whole week I did not smoke at all and during this time, my wife suffered terribly.\n\nI had all the usual symptoms of someone giving up smoking: a bad temper and an enormous appetite.\n\nMy friends kept on offering me cigarettes and cigars.\n\nThey made no effort to hide their amusement whenever I produced a packet of sweets from my pocket.\n\nAfter seven days of this I went to a party.\n\nEverybody around me was smoking and I felt extremely uncomfortable.\n\nWhen my old friend Brian urged me to accept a cigarette, it was more than I could bear.\n\nI took one guiltily, lit it and smoked with satisfaction.\n\nMy wife was delighted that things had returned to normal once more.\n\nAnyway, as Brian pointed out, it is the easiest thing in the world to give up smoking.\n\nHe himself has done it lots of times!"},{"id":"book-2-lesson-79","bookNumber":2,"number":79,"title":"By air","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/lesson-79-by-air-45060194/","text":"First listen and then answer the question.\n\nWhy did the plane turn back?\n\nI used to travel by air a great deal when I was a boy.\n\nMy parents used to live in South America and I used to fly there from Europe in the holidays.\n\nA flight attendant would take charge of me and I never had an unpleasant experience.\n\nI am used to travelling by air and only on one occasion have I ever felt frightened.\n\nAfter taking off, we were flying low over the city and slowly gaining height, when the plane suddenly turned round and flew back to the airport.\n\nWhile we were waiting to land, a flight attendant told us to keep calm and to get off the plane quietly as soon as it had touched down.\n\nEverybody on board was worried and we were curious to find out what had happened.\n\nLater we learnt that there was a very important person on board.\n\nThe police had been told that a bomb had been planted on the plane.\n\nAfter we had landed, the plane was searched thoroughly.\n\nFortunately, nothing was found and five hours later we were able to take off again."},{"id":"book-2-lesson-80","bookNumber":2,"number":80,"title":"The Crystal Palace","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-080-the-crystal-palace-45060196/","text":"Lesson 80. The Crystal Palace.\n\nFirst listen and then answer the question.\n\nHow many people visited the Great Exhibition of 1851?\n\nPerhaps the most extraordinary building of the nineteenth century was the Crystal Palace, which was built in Hyde Park for the Great Exhibition of 1851.\n\nThe Crystal Palace was different from all other buildings in the world, for it was made of iron and glass.\n\nIt was one of the biggest buildings of all time and a lot of people from many countries came to see it.\n\nA great many goods were sent to the exhibition from various parts of the world.\n\nThere was also a great deal of machinery on display.\n\nThe most wonderful piece of machinery on show was Nazmyth's steam hammer.\n\nThough in those days, travelling was not as easy as it is today, steamboats carried thousands of visitors across the Channel from Europe.\n\nOn arriving in England, they were taken to the Crystal Palace by train.\n\nThere were six million visitors in all, and the profits from the exhibition were used to build museums and colleges.\n\nLater, the Crystal Palace was moved to South London.\n\nIt remained one of the most famous buildings in the world until it was burnt down in 1936."},{"id":"book-2-lesson-81","bookNumber":2,"number":81,"title":"Escape","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-081-escape-45060199/","text":"Lesson 81. Escape.\n\nFirst listen and then answer the question.\n\nWhy did the prisoner attack the driver?\n\nWhen he had killed the guard, the prisoner of war quickly dragged him into the bushes.\n\nWorking rapidly in the darkness, he soon changed into the dead man's clothes.\n\nNow, dressed in a blue uniform and with a rifle over his shoulder, the prisoner marched boldly up and down in front of the camp.\n\nHe could hear shouting in the camp itself.\n\nLights were blazing and men were running here and there: they had just discovered that a prisoner had escaped.\n\nAt that moment, a large black car with four officers inside it, stopped at the camp gates.\n\nThe officers got out and the prisoner stood to attention and saluted as they passed.\n\nWhen they had gone, the driver of the car came towards him.\n\nThe man obviously wanted to talk.\n\nHe was rather elderly with grey hair and clear blue eyes.\n\nThe prisoner felt sorry for him, but there was nothing else he could do.\n\nAs the man came near, the prisoner knocked him to the ground with a sharp blow.\n\nThen, jumping into the car, he drove off as quickly as he could."},{"id":"book-2-lesson-82","bookNumber":2,"number":82,"title":"Monster or fish?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-082-monster-or-fish-45060202/","text":"Lesson 82. Monster or fish?\n\nFirst listen and then answer the question.\n\nWhat was the monster called?\n\nFishermen and sailors sometimes claim to have seen monsters in the sea.\n\nThough people have often laughed at stories told by seamen, it is now known that many of these 'monsters' which have at times been sighted are simply strange fish.\n\nOccasionally, unusual creatures are washed to the shore, but they are rarely caught out at sea.\n\nSome time ago, however, a peculiar fish was caught near Madagascar.\n\nA small fishing boat was carried miles out to sea by the powerful fish as it pulled on the line.\n\nRealising that this was no ordinary fish, the fishermen made every effort not to damage it in any way.\n\nWhen it was eventually brought to shore, it was found to be over thirteen feet long.\n\nIt had a head like a horse, big blue eyes, shining silver skin, and a bright red tail.\n\nThe fish, which has since been sent to a museum where it is being examined by a scientist, is called an oarfish.\n\nSuch creatures have rarely been seen alive by man as they live at a depth of six hundred feet."},{"id":"book-2-lesson-83","bookNumber":2,"number":83,"title":"After the elections","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/lesson-83-after-the-elections-45060204/","text":"First listen and then answer the question.\n\nWhy did Patrick keep on asking the same question?\n\nThe former Prime Minister, Mr Wentworth Lane, was defeated in the recent elections.\n\nHe is now retiring from political life and has gone abroad.\n\nMy friend, Patrick, has always been a fanatical opponent of Mr Lane's Radical Progressive Party.\n\nAfter the elections, Patrick went to the former Prime Minister's house.\n\nWhen he asked if Mr Lane lived there, the policeman on duty told him that since his defeat, the ex-Prime Minister had gone abroad.\n\nOn the following day, Patrick went to the house again.\n\nThe same policeman was just walking slowly past the entrance, when Patrick asked the same question.\n\nThough a little suspicious this time, the policeman gave him the same answer.\n\nThe day after, Patrick went to the house once more and asked exactly the same question.\n\nThis time, the policeman lost his temper.\n\n'I told you yesterday and the day before yesterday,' he shouted, 'Mr Lane was defeated in the elections.\n\nHe has retired from political life and gone to live abroad!'\n\n'I know,' answered Patrick, 'but I love to hear you say it!'"},{"id":"book-2-lesson-84","bookNumber":2,"number":84,"title":"On strike","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-084-on-strike-45060206/","text":"Lesson 84. On strike.\n\nFirst listen and then answer the question.\n\nWho will be driving the buses next week?\n\nBusmen have decided to go on strike next week.\n\nThe strike is due to begin on Tuesday.\n\nNo one knows how long it will last.\n\nThe busmen have stated that the strike will continue until general agreement is reached about pay and working conditions.\n\nMost people believe that the strike will last for at least a week.\n\nMany owners of private cars are going to offer free rides to people on their way to work.\n\nThis will relieve pressure on the trains to some extent.\n\nMeanwhile, a number of university students have volunteered to drive buses while the strike lasts.\n\nAll the young men are expert drivers, but before they drive any of the buses, they will have to pass a special test.\n\nThe students are going to take the test in two days' time.\n\nEven so, people are going to find it difficult to get to work.\n\nBut so far, the public has expressed its gratitude to the students in letters to the press.\n\nOnly one or two people have objected that the students will drive too fast!"},{"id":"book-2-lesson-85","bookNumber":2,"number":85,"title":"Never too old to learn","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-085-never-too-old-to-learn-45060210/","text":"Lesson 85. Never too old to learn.\n\nFirst listen and then answer the question.\n\nHow long has Mr. Page been teaching?\n\nI have just received a letter from my old school informing me that my former headmaster, Mr Stuart Page, will be retiring next week.\n\nPupils of the school, old and new, will be sending him a present to mark the occasion.\n\nAll those who have contributed towards the gift will sign their names in a large album which will be sent to the headmaster's home.\n\nWe shall all remember Mr Page for his patience and understanding and for the kindly encouragement he gave us when we went so unwillingly to school.\n\nA great many former pupils will be attending a farewell dinner in his honour next Thursday.\n\nIt is a curious coincidence that the day before his retirement, Mr Page will have been teaching for a total of forty years.\n\nAfter he has retired, he will devote himself to gardening.\n\nFor him, this will be an entirely new hobby.\n\nBut this does not matter, for, as he has often remarked, one is never too old to learn."},{"id":"book-2-lesson-86","bookNumber":2,"number":86,"title":"Out of control","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-086-out-of-control-45060217/","text":"Lesson 86. Out of control.\n\nFirst listen and then answer the question.\n\nWhat was the danger?\n\nAs the man tried to swing the speedboat round, the steering wheel came away in his hands.\n\nHe waved desperately to his companion, who had been water skiing for the last fifteen minutes.\n\nBoth men had hardly had time to realise what was happening when they were thrown violently into the sea.\n\nThe speedboat had struck a buoy, but it continued to move very quickly across the water.\n\nBoth men had just begun to swim towards the shore, when they noticed with dismay that the speedboat was moving in a circle.\n\nIt now came straight towards them at tremendous speed.\n\nIn less than a minute, it roared past them only a few feet away.\n\nAfter it had passed, they swam on as quickly as they could because they knew that the boat would soon return.\n\nThey had just had enough time to swim out of danger when the boat again completed a circle.\n\nOn this occasion, however, it had slowed down considerably.\n\nThe petrol had nearly all been used up.\n\nBefore long, the noise dropped completely and the boat began to drift gently across the water."},{"id":"book-2-lesson-87","bookNumber":2,"number":87,"title":"A perfect alibi","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/lesson-87-a-perfect-alibi-45060220/","text":"First listen and then answer the question.\n\nWhat was wrong with the man's story?\n\n'At the time the murder was committed, I was travelling on the 8 o'clock train to London,' said the man.\n\n'Do you always catch such an early train?'\n\nasked the inspector.\n\n'Of course I do,' answered the man.\n\n'I must be at work at 10 o'clock.\n\nMy employer will confirm that I was there on time.'\n\n'Would a later train get you to work on time?'\n\nasked the inspector.\n\n'I suppose it would, but I never catch a later train.'\n\n'At what time did you arrive at the station?'\n\n'At ten to eight.\n\nI bought a paper and waited for the train.'\n\n'And you didn't notice anything unusual?'\n\n'Of course not.'\n\n'I suggest,' said the inspector, 'that you are not telling the truth.\n\nI suggest that you did not catch the 8 o'clock train, but that you caught the 8.25 which would still get you to work on time.\n\nYou see, on the morning of the murder, the 8 o'clock train did not run at all.\n\nIt broke down at Fern Green Station and was taken off the line."},{"id":"book-2-lesson-88","bookNumber":2,"number":88,"title":"Trapped in a mine","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-088-trapped-in-a-mine-45060226/","text":"Lesson 88. Trapped in a mine.\n\nFirst listen and then answer the question.\n\nWhy is the rescue taking so long?\n\nSix men have been trapped in a mine for seventeen hours.\n\nIf they are not brought to the surface soon they may lose their lives.\n\nHowever, rescue operations are proving difficult.\n\nIf explosives are used, vibrations will cause the roof of the mine to collapse.\n\nRescue workers are therefore drilling a hole on the north side of the mine.\n\nThey intend to bring the men up in a special capsule.\n\nIf there had not been a hard layer of rock beneath the soil, they would have completed the job in a few hours.\n\nAs it is, they have been drilling for sixteen hours and they still have a long way to go.\n\nMeanwhile, a microphone, which was lowered into the mine two hours ago, has enabled the men to keep in touch with their closest relatives.\n\nThough they are running out of food and drink, the men are cheerful and confident that they will get out soon.\n\nThey have been told that rescue operations are progressing smoothly.\n\nIf they knew how difficult it was to drill through the hard rock, they would lose heart."},{"id":"book-2-lesson-89","bookNumber":2,"number":89,"title":"A slip of the tongue","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/lesson-89-a-slip-of-the-tongue-45060229/","text":"First listen and then answer the question.\n\nWho made the only funny joke that evening and why?\n\nPeople will do anything to see a free show -- even if it is a bad one.\n\nWhen the news got round that a comedy show would be presented at our local cinema by the P. and U. Bird Seed Company, we all rushed to see it.\n\nWe had to queue for hours to get in and there must have been several hundred people present just before the show began.\n\nUnfortunately, the show was one of the dullest we have ever seen.\n\nThose who failed to get in need not have felt disappointed, as many of the artistes who should have appeared did not come.\n\nThe only funny things we heard that evening came from the advertiser at the beginning of the programme.\n\nHe was obviously very nervous and for some minutes stood awkwardly before the microphone.\n\nAs soon as he opened his mouth, everyone burst out laughing.\n\nWe all know what the poor man should have said, but what he actually said was: 'This is the Poo and Ee Seed Bird Company.\n\nGood ladies, evening and gentlemen!"},{"id":"book-2-lesson-90","bookNumber":2,"number":90,"title":"What's for supper?","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/lesson-90-whats-for-supper-45060230/","text":"First listen and then answer the question.\n\nWhat kind of fish are they?\n\nFish and chips has always been a favourite dish in Britain, but as the oceans have been overfished, fish has become more and more expensive.\n\nSo it comes as a surprise to learn that giant fish are terrifying the divers on North Sea oil rigs.\n\nOil rigs have to be repaired frequently and divers, who often have to work in darkness a hundred feet under water, have been frightened out of their wits by giant fish bumping into them as they work.\n\nNow they have had special cages made to protect them from these monsters.\n\nThe fish are not sharks or killer whales, but favourite eating varieties like cod and skate which grow to unnatural sizes, sometimes as much as twelve feet in length.\n\nThree factors have caused these fish to grow so large: the warm water round the hot oil pipes under the sea; the plentiful supply of food thrown overboard by the crews on the rigs; the total absence of fishing boats around the oil rigs.\n\nAs a result, the fish just eat and eat and grow and grow in the lovely warm water.\n\nWho eats who?"},{"id":"book-2-lesson-91","bookNumber":2,"number":91,"title":"Three men in a basket","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-091-three-men-in-a-basket-45060233/","text":"Lesson 91. Three men in a basket.\n\nFirst listen and then answer the question.\n\nWhere was the station's Commanding Officer?\n\nA pilot noticed a balloon which seemed to be making for a Royal Air Force Station nearby.\n\nHe informed the station at once, but no one there was able to explain the mystery.\n\nThe officer in the control tower was very angry when he heard the news, because balloons can be a great danger to aircraft.\n\nHe said that someone might be spying on the station and the pilot was ordered to keep track of the strange object.\n\nThe pilot managed to circle the balloon for some time.\n\nHe could make out three men in a basket under it and one of them was holding a pair of binoculars.\n\nWhen the balloon was over the station, the pilot saw one of the men taking photographs.\n\nSoon afterwards, the balloon began to descend and it landed near an airfield.\n\nThe police were called in, but they could not arrest anyone, for the basket contained two Members of Parliament and the Commanding Officer of the station!\n\nAs the Commanding Officer explained later, one half of the station did not know what the other half was doing!"},{"id":"book-2-lesson-92","bookNumber":2,"number":92,"title":"Asking for trouble","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-092-asking-for-trouble-45060234/","text":"Lesson 92. Asking for trouble.\n\nFirst listen and then answer the question.\n\nWhy did the policeman ask the writer to come to the police station?\n\nIt must have been about two in the morning when I returned home.\n\nI tried to wake up my wife by ringing the doorbell, but she was fast asleep, so I got a ladder from the shed in the garden, put it against the wall, and began climbing towards the bedroom window.\n\nI was almost there when a sarcastic voice below said, 'I don't think the windows need cleaning at this time of the night.'\n\nI looked down and nearly fell off the ladder when I saw a policeman.\n\nI immediately regretted answering in the way I did, but I said, 'I enjoy cleaning windows at night.'\n\n'So do I,' answered the policeman in the same tone.\n\n'Excuse my interrupting you.\n\nI hate to interrupt a man when he's busy working, but would you mind coming with me to the station?'\n\n'Well, I'd prefer to stay here,' I said.\n\n'You see, I've forgotten my key.'\n\n'Your what?'\n\nhe called.\n\n'My key,' I shouted.\n\nFortunately, the shouting woke up my wife who opened the window just as the policeman had started to climb towards me."},{"id":"book-2-lesson-93","bookNumber":2,"number":93,"title":"A noble gift","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-093-a-noble-gift-45060236/","text":"Lesson 93. A noble gift.\n\nFirst listen and then answer the question.\n\nWhere was the Statue of Liberty made?\n\nOne of the most famous monuments in the world, the Statue of Liberty, was presented to the United States of America in the nineteenth century by the people of France.\n\nThe great statue, which was designed by the sculptor Auguste Bartholdi, took ten years to complete.\n\nThe actual figure was made of copper supported by a metal framework which had been especially constructed by Eiffel.\n\nBefore it could be transported to the United States, a site had to be found for it and a pedestal had to be built.\n\nThe site chosen was an island at the entrance of New York Harbour.\n\nBy 1884, a statue which was 151 feet tall had been erected in Paris.\n\nThe following year, it was taken to pieces and sent to America.\n\nBy the end of October 1886, the statue had been put together again and it was officially presented to the American people by Bartholdi.\n\nEver since then, the great monument has been a symbol of liberty for the millions of people who have passed through New York Harbour to make their homes in America."},{"id":"book-2-lesson-94","bookNumber":2,"number":94,"title":"Future champions","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/lesson-94-future-champions-45060239/","text":"First listen and then answer the question.\n\nWhat kind of race do the children compete in?\n\nExperiments have proved that children can be instructed in swimming at a very early age.\n\nAt a special swimming pool in Los Angeles, children become expert at holding their breath under water even before they can walk.\n\nBabies of two months old do not appear to be reluctant to enter the water.\n\nIt is not long before they are so accustomed to swimming that they can pick up weights from the floor of the pool.\n\nA game that is very popular with these young swimmers is the underwater tricycle race.\n\nTricycles are lined up on the floor of the pool seven feet under water.\n\nThe children compete against each other to reach the other end of the pool.\n\nMany pedal their tricycles, but most of them prefer to push or drag them.\n\nSome children can cover the whole length of the pool without coming up for breath even once.\n\nWhether they will ever become future Olympic champions, only time will tell.\n\nMeanwhile, they should encourage those among us who cannot swim five yards before they are gasping for air."},{"id":"book-2-lesson-95","bookNumber":2,"number":95,"title":"A fantasy","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-095-a-fantasy-45060242/","text":"Lesson 95. A fantasy.\n\nFirst listen and then answer the question.\n\nWhy was the ambassador particularly lucky?\n\nWhen the Ambassador of Escalopia returned home for lunch, his wife got a shock.\n\nHe looked pale and his clothes were in a frightful state.\n\n\"What has happened?\"\n\nshe asked.\n\n\"How did your clothes get into such a mess?\"\n\n\"A fire extinguisher, my dear,\" answered the Ambassador drily.\n\n\"University students set the Embassy on fire this morning.\"\n\n\"Good heavens!\"\n\nexclaimed his wife.\n\n\"And where were you at the time?\"\n\n\"I was in my office as usual,\" answered the Ambassador.\n\n\"The fire broke out in the basement.\n\nI went down immediately, of course, and that fool, Horst, aimed a fire extinguisher at me.\n\nHe thought I was on fire.\n\nI must definitely get that fellow posted.\"\n\nThe Ambassador's wife went on asking questions, when she suddenly noticed a big hole in her husband's hat.\n\n\"And how can you explain that?\"\n\nshe asked.\n\n\"Oh, that,\" said the Ambassador.\n\n\"Someone fired a shot through my office window.\n\nAccurate, don't you think?\"\n\nFortunately, I was not wearing it at the time.\n\nIf I had been, I would not have been able to get home for lunch."},{"id":"book-2-lesson-96","bookNumber":2,"number":96,"title":"The dead return","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2772273/2-096-the-dead-return-45060243/","text":"Lesson 96. The dead return.\n\nFirst listen and then answer the question.\n\nWhat happens to the lanterns at the end of the festival?\n\nA Festival for the Dead is held once a year in Japan.\n\nThis festival is a cheerful occasion, for on this day, the dead are said to return to their homes and they are welcomed by the living.\n\nAs they are expected to be hungry after their long journey, food is laid out for them.\n\nSpecially-made lanterns are hung outside each house to help the dead to find their way.\n\nAll night long, people dance and sing.\n\nIn the early morning, the food that had been laid out for the dead is thrown into a river or into the sea as it is considered unlucky for anyone living to eat it.\n\nIn towns that are near the sea, the tiny lanterns which had been hung in the streets the night before, are placed into the water when the festival is over.\n\nThousands of lanterns slowly drift out to sea guiding the dead on their return journey to the other world.\n\nThis is a moving spectacle, for crowds of people stand on the shore watching the lanterns drifting away until they can be seen no more."}]},{"number":3,"title":"New Concept English 3","subtitle":"Developing Skills","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/","lessons":[{"id":"book-3-lesson-1","bookNumber":3,"number":1,"title":"A puma at large","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-001-a-puma-at-large-45223704/","text":"Lesson 1. A puma at large.\n\nListen to the tape, then answer the question below.\n\nWhere must the puma have come from?\n\nPumas are large, cat-like animals, which are found in America.\n\nWhen reports came into London Zoo that a wild puma had been spotted forty-five miles south of London, they were not taken seriously.\n\nHowever, as the evidence began to accumulate, experts from the zoo felt obliged to investigate, for the descriptions given by people who claimed to have seen the puma were extraordinarily similar.\n\nThe hunt for the puma began in a small village where a woman, picking blackberries, saw a large cat only five yards away from her.\n\nIt immediately ran away when she saw it, and experts confirmed that a puma will not attack a human being unless it is cornered.\n\nThe search proved difficult, for the puma was often observed at one place in the morning and at another place twenty miles away in the evening.\n\nWherever it went, it left behind it a trail of dead deer and small animals like rabbits.\n\nPaw prints were seen in a number of places, and puma fur was found clinging to bushes.\n\nSeveral people complained of cat-like noises at night, and a businessman on a fishing trip saw the puma up a tree.\n\nThe experts were now fully convinced that the animal was a puma.\n\nBut where had it come from?\n\nAs no pumas had been reported missing from any zoo in the country, this one must have been in the possession of a private collector, and somehow managed to escape.\n\nThe hunt went on for several weeks, but the puma was not caught.\n\nIt is disturbing to think that a dangerous wild animal is still at large in the quiet countryside."},{"id":"book-3-lesson-2","bookNumber":3,"number":2,"title":"Thirteen equals one","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-002-thirteen-equals-one-45223705/","text":"Lesson 2. Thirteen equals one.\n\nListen to the tape, then answer the question below.\n\nWas the vicar pleased that the clock was striking?\n\nWhy?\n\nOur vicar is always raising money for one cause or another, but he has never managed to get enough money to have the church clock repaired.\n\nThe big clock, which used to strike the hours day and night, was damaged many years ago and has been silent ever since.\n\nOne night, however, our vicar woke up with a start:the clock was striking the hours!\n\nLooking at his watch, he saw that it was one o'clock, but the bell struck thirteen times before it stopped.\n\nArmed with a torch, the vicar went up into the clock tower to see what was going on.\n\nIn the torchlight, he caught sight of a figure whom he immediately recognized as Bill Wilkins, our local grocer.\n\nWhatever are you doing up here, Bill? asked the vicar in surprise.\n\nI'm trying to repair the bell, answered Bill.\n\nI've been coming up here night after night for weeks now.\n\nYou see, I was hoping to give you a surprise.\n\nYou certainly did give me a surprise, said the vicar.\n\nYou've probably woken up everyone in the village as well.\n\nStill, I'm glad the bell is working again.\n\nThat's the trouble, vicar, answered Bill.\n\nIt's working all right, but I'm afraid that at one o'clock it will strike thirteen times and there's nothing I can do about it.\n\nWe'll get used to that, Bill, said the vicar.\n\n'Thirteen is not as good as one, but it's better than nothing.\n\nNow let's go downstairs and have a cup of tea."},{"id":"book-3-lesson-3","bookNumber":3,"number":3,"title":"An unknown goddess","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-003-an-unknown-goddess-45223634/","text":"Lesson 3. An unknown goddess.\n\nListen to the tape, then answer the question below.\n\nHow did the archaeologists know that the statue was a goddess?\n\nSome time ago, an interesting discovery was made by archaeologists on the Aegean island of Kea.\n\nAn American team explored a temple which stands in an ancient city on the promontory of Ayia Irini.\n\nThe city at one time must have been prosperous, for it enjoyed a high level of civilization.\n\nHouses often three storeys high -- were built of stone.\n\nThey had large rooms with beautifully decorated walls.\n\nThe city was even equipped with a drainage system, for a great many clay pipes were found beneath the narrow streets.\n\nThe temple which the archaeologists explored was used as a place of worship from the fifteenth century B.C. until Roman times.\n\nIn the most sacred room of the temple, clay fragments of fifteen statues were found.\n\nEach of these represented a goddess and had, at one time, been painted.\n\nThe body of one statue was found among remains dating from the 15th century B.C.\n\nIts missing head happened to be among remains of the fifth century B.C.\n\nThis head must have been found in classical times and carefully preserved.\n\nIt was very old and precious even then.\n\nWhen the archaeologists reconstructed the fragments, they were amazed to find that the goddess turned out to be a very modern-looking woman.\n\nShe stood three feet high and her hands rested on her hips.\n\nShe was wearing a full-length skirt, which swept the ground.\n\nDespite her great age, she was very graceful indeed, but, so far, the archaeologists have been unable to discover her identity."},{"id":"book-3-lesson-4","bookNumber":3,"number":4,"title":"The double life of Alfred Bloggs","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-004-the-double-life-of-alfred-blog-45223674/","text":"Lesson 4. The double life of Alfred Bloggs.\n\nListen to the tape, then answer the question below.\n\nWhy did Alf want a white-collar job?\n\nThese days, people who do manual work often receive far more money than people who work in offices.\n\nPeople who work in offices are frequently referred to as white-collar workers for the simple reason that they usually wear a collar and tie to go to work.\n\nSuch is human nature that a great many people are often willing to sacrifice higher pay for the privilege of becoming white-collar workers.\n\nThis can give rise to curious situations, as it did in the case of Alfred Bloggs, who worked as a dustman for the Ellesmere Corporation.\n\nWhen he got married, Alf was too embarrassed to say anything to his wife about his job.\n\nHe simply told her that he worked for the corporation.\n\nEvery morning, he left home dressed in a smart black suit.\n\nHe then changed into overalls and spent the next eight hours as a dustman.\n\nBefore returning home at night, he took a shower and changed back into his suit.\n\nAlf did this for over two years and his fellow dustmen kept his secret.\n\nAlf's wife has never discovered that she married a dustman, and she never will, for Alf has just found another job.\n\nHe will soon be working in an office.\n\nHe will be earning only half as much as he used to, but he feels that his rise in status is well worth the loss of money.\n\nFrom now on, he will wear a suit all day, and others will call him Mr. Bloggs, not Alf."},{"id":"book-3-lesson-5","bookNumber":3,"number":5,"title":"The facts","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-005-the-facts-45223706/","text":"Lesson 5. The facts.\n\nListen to the tape, then answer the question below.\n\nWhat was the consequence of the editor's insistence on facts and statistics?\n\nEditors of newspapers and magazines often go to extremes to provide their readers with unimportant facts and statistics.\n\nLast year, a journalist had been instructed by a well-known magazine to write an article on the President's Palace in a new African Republic.\n\nWhen the article arrived, the editor read the first sentence and then refused to publish it.\n\nThe article began:'Hundreds of steps lead to the high wall which surrounds the President's Palace.\n\nThe editor at once sent the journalist a fax, instructing him to find out the exact number of steps and the height of the wall.\n\nThe journalist immediately set out to obtain these important facts, but he took a long time to send them.\n\nMeanwhile, the editor was getting impatient, for the magazine would soon go to press.\n\nHe sent the journalist two more faxes, but received no reply.\n\nHe sent yet another fax, informing the journalist that if he did not reply soon, he would be fired.\n\nWhen the journalist again failed to reply, the editor reluctantly published the article as it had originally been written.\n\nA week later, the editor at last received a fax from the journalist.\n\nNot only had the poor man been arrested, but he had been sent to prison as well.\n\nHowever, he had at last been allowed to send a fax, in which he informed the editor that he had been arrested while counting the 1,084 steps leading to the 15th foot wall which surrounded the President's Palace."},{"id":"book-3-lesson-6","bookNumber":3,"number":6,"title":"Smash-and-grab","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-006-smash-and-grab-45223707/","text":"Lesson 6. Smash-and-grab.\n\nListen to the tape, then answer the question below.\n\nHow did Mr. Taylor try to stop the thieves?\n\nThe expensive shops in a famous arcade near Piccadilly were just opening.\n\nAt this time of the morning, the arcade was almost empty.\n\nMr. Taylor, the owner of a jewelry shop, was admiring a new window display.\n\nTwo of his assistants had been working busily since eight o'clock, and had only just finished.\n\nDiamond necklaces and rings had been beautifully arranged on a background of black velvet.\n\nAfter gazing at the display for several minutes, Mr. Taylor went back into his shop.\n\nThe silence was suddenly broken when a large car, with its headlights on and its horn blaring, roared down the arcade.\n\nIt came to a stop outside the jewelers.\n\nOne man stayed at the wheel, while two others, with black stockings over their faces, jumped out and smashed the window of the shop with iron bars.\n\nWhile this was going on, Mr. Taylor was upstairs.\n\nHe and his staff began throwing furniture out of the window.\n\nChairs and tables went flying into the arcade.\n\nOne of the thieves was struck by a heavy statue, but he was too busy helping himself to diamonds to notice any pain.\n\nThe raid was all over in three minutes, for the men scrambled back into the car, and it moved off at a fantastic speed.\n\nJust as it was leaving, Mr. Taylor rushed out and ran after it, throwing ashtrays and vases, but it was impossible to stop the thieves.\n\nThey had got away with thousands of pounds worth of diamonds."},{"id":"book-3-lesson-7","bookNumber":3,"number":7,"title":"Mutilated ladies","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-007-mutilated-ladies-45223708/","text":"Lesson 7. Mutilated ladies.\n\nListen to the tape, then answer the question below.\n\nWhy did Jane cook John's wallet?\n\nHave you ever put your trousers in the washing machine and then remembered there was a large bank note in your back pocket?\n\nWhen you rescued your trousers, did you find the note was whiter than white?\n\nPeople who live in Britain needn't despair when they make mistakes like this.\n\nAnd a lot of people do.\n\nFortunately for them, the Bank of England has a team called Mutilated Ladies, which deals with claims from people who fed their money to a machine or to their dog.\n\nDogs, it seems, love to chew up money.\n\nA recent case concerns Jane Butlin, whose fiance, John, runs a successful furniture business.\n\nJohn had a very good day and put his wallet, containing £3,000, into the microwave oven for safekeeping.\n\nThen he and Jane went horse-riding.\n\nWhen they got home, Jane cooked their dinner in the microwave oven, and without realizing it, cooked her fiance's wallet as well.\n\nImagine their dismay when they found a beautifully-cooked wallet and notes turned to ash!\n\nJohn went to see his bank manager, who sent the remains of wallet and the money to the Special Department of the Bank of England in Newcastle, the Mutilated Ladies.\n\nThey examined the remains, and John got all his money back.\n\nSo long as there's something to identify, we will give people their money back, said a spokeswoman for the bank.\n\nLast year, we paid £1.5 million on 21,000 claims."},{"id":"book-3-lesson-8","bookNumber":3,"number":8,"title":"A famous monastery","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-008-a-famous-monastery-45223709/","text":"Lesson 8. A famous monastery.\n\nListen to the tape, then answer the question below.\n\nWhat are the St. Bernard dogs used for?\n\nThe Great St. Bernard Pass connects Switzerland to Italy.\n\nAt 2,473 metres, it is the highest mountain pass in Europe.\n\nThe famous monastery of St.Bernard, which was founded in the eleventh century, lies about a mile away.\n\nFor hundreds of years, St.Bernard dogs have saved the lives of travellers crossing the dangerous Pass.\n\nThese friendly dogs, which were first brought from Asia, were used as watchdogs even in Roman times.\n\nNow that a tunnel has been built through the mountains, the pass is less dangerous. but each year, the dogs are still sent out into the snow whenever a traveller is in difficulty.\n\nDespite the new tunnel, there are still a few people who rashly attempt to cross the pass on foot.\n\nDuring the summer months, the monastery is very busy, for it is visited by thousands of people who cross the pass in cars.\n\nAs there are so many people about, the dogs have to be kept in a special enclosure.\n\nIn winter, however, life at the monastery is quite different.\n\nThe monks prefer winter to summer, for they have more privacy.\n\nThe dogs have greater freedom, too, for they are allowed to wander outside their enclosure.\n\nThe only regular visitors to the monastery in winter are parties of skiers who go there at Christmas and Easter.\n\nThese young people, who love the peace of the mountains, always receive a warm welcome at St. Bernard's Monastery."},{"id":"book-3-lesson-9","bookNumber":3,"number":9,"title":"Flying cats","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-009-flying-cats-45223711/","text":"Lesson 9. Flying cats.\n\nListen to the tape, then answer the question below.\n\nHow do cats try to protect themselves when falling from great heights?\n\nCats never fail to fascinate human beings.\n\nThey can be friendly and affectionate towards humans, but they lead mysterious lives of their own as well.\n\nThey never become submissive like dogs and horses.\n\nAs a result, humans have learned to respect feline independence.\n\nMost cats remain suspicious of humans all their lives.\n\nOne of the things that fascinates us most about cats is the popular belief that they have nine lives.\n\nApparently, there is a good deal of truth in this idea.\n\nA cat's ability to survive falls is based on fact.\n\nRecently the New York Animal Medical Centre made a study of 132 cats over a period of five months.\n\nAll these cats had one experience in common.\n\nThey had fallen off high buildings, yet only eight of them died from shock or injuries.\n\nOf course, New York is the ideal place for such an interesting study, because there is no shortage of tall buildings.\n\nThere are plenty of high-rise windowsills to fall from.\n\nOne cat, Sabrina, fell 32 storeys, yet only suffered from a broken tooth.\n\nCats behave like well-trained paratroopers, a doctor said.\n\nIt seems that the further cats fall... the less they are likely to injure themselves.\n\nIn a long drop, they reach speeds of 60 miles an hour and more.\n\nAt high speeds, falling cats have time to relax.\n\nThey stretch out their legs like flying squirrels.\n\nThis increases their air-resistance and reduces the shock of impact when they hit the ground."},{"id":"book-3-lesson-10","bookNumber":3,"number":10,"title":"The loss of the Titanic","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-010-the-loss-of-the-titanic-45223712/","text":"Lesson 10. The loss of the Titanic.\n\nListen to the tape, then answer the question below.\n\nWhat would have happened if only two of the sixteen water-tight compartments had been flooded?\n\nThe great ship, Titanic sailed for New York from Southampton on April 10th, 1912.\n\nShe was carrying 1,316 passengers and a crew of 891.\n\nEven by modern standards, the 46, 000 ton Titanic was a colossal ship.\n\nAt that time, however, she was not only the largest ship that had ever been built, but was regarded as unsinkable, for she had sixteen water-tight compartments.\n\nEven if two of these were flooded, she would still be able to float.\n\nThe tragic sinking of this great liner will always be remembered, for she went down on her first voyage with heavy loss of life.\n\nFour days after setting out, while the Titanic was sailing across the icy waters of the North Atlantic, a huge iceberg was suddenly spotted by a lookout.\n\nAfter the alarm had been given, the great ship turned sharply to avoid a direct collision.\n\nThe Titanic turned just in time, narrowly missing the immense wall of ice which rose over 100 feet out of the water beside her.\n\nSuddenly, there was a slight trembling sound from below, and the captain went down to see what had happened.\n\nThe noise had been so faint that no one thought that the ship had been damaged.\n\nBelow, the captain realized to his horror that the Titanic was sinking rapidly, for five of her sixteen watertight compartments had already been flooded.\n\nThe order to abandon ship was given, and hundreds of people plunged into the icy water.\n\nAs there were not enough life-boats for everybody, 1,500 lives were lost."},{"id":"book-3-lesson-11","bookNumber":3,"number":11,"title":"Not guilty","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-011-not-guilty-45223713/","text":"Lesson 11. Not guilty.\n\nListen to the tape, then answer the question below.\n\nWhat was the customs officer looking for?\n\nCustoms officers are quite tolerant these days, but they can still stop you when you are going through the green channel and have nothing to declare.\n\nEven really honest people are often made to feel guilty.\n\nThe hardened professional smuggler, on the other hand, is never troubled by such feelings, even if he has five hundred gold watches hidden in his suitcase.\n\nWhen I returned from abroad recently, a particularly officious young customs officer clearly regarded me as a smuggler.\n\nHave you anything to declare? he asked, looking me in the eye.\n\nNo, I answered confidently.\n\nWould you mind unlocking this suitcase, please?\n\nNot at all, I answered.\n\nThe officer went through the case with great care.\n\nAll the things I had packed so carefully were soon in a dreadful mess.\n\nI felt sure I would never be able to close the case again.\n\nSuddenly, I saw the officer's face light up.\n\nHe had spotted a tiny bottle at the bottom of my case, and he pounced on it with delight.\n\n'Perfume, eh?' he asked sarcastically.\n\nYou should have declared that.\n\nPerfume is not exempt from import duty.\n\nBut it isn't perfume, I said.\n\nIt's hair gel.\n\nThen I added with a smile, it's a strange mixture I make myself.\n\nAs I expected, he did not believe me.\n\nTry it, I said encouragingly.\n\nThe officer unscrewed the cap and put the bottle to his nostrils.\n\nHe was greeted by an unpleasant smell, which convinced him that I was telling the truth.\n\nA few minutes later, I was able to hurry away with precious chalk marks on my baggage."},{"id":"book-3-lesson-12","bookNumber":3,"number":12,"title":"Life on a desert island","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-012-life-on-a-desert-island-45223714/","text":"Lesson 12. Life on a desert island.\n\nListen to the tape, then answer the question below.\n\nWhat was exceptional about the two men's stay on the desert island?\n\nMost of us have formed an unrealistic picture of life on a desert island.\n\nWe sometimes imagine a desert island to be a sort of paradise where the sun always shines.\n\nLife there is simple and good.\n\nRipe fruit falls from the trees and you never have to work.\n\nThe other side of the picture is quite the opposite.\n\nLife on a desert island is wretched.\n\nYou either starve to death or live like Robinson Crusoe, waiting for a boat which never comes.\n\nPerhaps there is an element of truth in both these pictures, but few of us have had the opportunity to find out.\n\nTwo men who recently spent five days on a coral island wished they had stayed there longer.\n\nThey were taking a badly damaged boat from the Virgin Islands to Miami to have it repaired.\n\nDuring the journey, their boat began to sink.\n\nThey quickly loaded a small rubber dinghy with food, matches, and cans of beer and rowed for a few miles across the Caribbean until they arrived at a tiny coral island.\n\nThere were hardly any trees on the island and there was no water.\n\nBut this did not prove to be a problem.\n\nThe men collected rainwater in the rubber dinghy.\n\nAs they had brought a spear gun with them, they had plenty to eat.\n\nThey caught lobster and fish every day, and as one of them put it, ate like kings.\n\nWhen a passing tanker rescued them five days later, both men were genuinely sorry that they had to leave."},{"id":"book-3-lesson-13","bookNumber":3,"number":13,"title":"It's only me","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-013-its-only-me-45223715/","text":"Lesson 13. It's only me.\n\nListen to the tape, then answer the question below.\n\nWhat did the man expect to find under the stairs?\n\nAfter her husband had gone to work, Mrs. Richards sent her children to school and went upstairs to her bedroom.\n\nShe was too excited to do any housework that morning, for in the evening she would be going to a fancy dress party with her husband.\n\nShe intended to dress up as a ghost, and as she had made her costume the night before, she was impatient to try it on.\n\nThough the costume consisted only of a sheet, it was very effective.\n\nAfter putting it on, Mrs. Richards went downstairs.\n\nShe wanted to find out whether it would be comfortable to wear.\n\nJust as Mrs. Richards was entering the dining room, there was a knock on the front door.\n\nShe knew that it must be the baker.\n\nShe had told him to come straight in if ever she failed to open the door, and to leave the bread on the kitchen table.\n\nNot wanting to frighten the poor man, Mrs. Richards quickly hid in the small storeroom under the stairs.\n\nShe heard the front door open and heavy footsteps in the hall.\n\nSuddenly, the door of the storeroom was opened, and a man entered.\n\nMrs. Richards realized that it must be the man from the electricity board who had come to read the meter.\n\nShe tried to explain the situation, saying, It's only me, but it was too late.\n\nThe man let out a cry and jumped back several paces.\n\nWhen Mrs. Richards walked towards him, he fled, slamming the door behind him."},{"id":"book-3-lesson-14","bookNumber":3,"number":14,"title":"A noble gangster","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-014-a-noble-gangster-45223717/","text":"Lesson 14. A noble gangster.\n\nListen to the tape, then answer the question below.\n\nHow did Hawkwood make money in times of peace?\n\nThere was a time when the owners of shops and businesses in Chicago had to pay large sums of money to gangsters in return for protection.\n\nIf the money was not paid promptly, the gangsters would quickly put a man out of business by destroying his shop.\n\nObtaining protection money is not a modern crime.\n\nAs long ago as the fourteenth century, an Englishman, Sir John Hawkwood, made the remarkable discovery that people would rather pay large sums of money than have their life work destroyed by gangsters.\n\nSix hundred years ago, Sir John Hawkwood arrived in Italy with a band of soldiers and settled near Florence.\n\nHe soon made a name for himself and came to be known to the Italians as Giovanni Acuto.\n\nWhenever the Italian city-states were at war with each other, Hawkwood used to hire his soldiers to princes who were willing to pay the high price he demanded.\n\nIn times of peace, when business was bad, Hawkwood and his men would march into a city-state and, after burning down a few farms, would offer to go away if protection money was paid to them.\n\nHawkwood made large sums of money in this way.\n\nIn spite of this, the Italians regarded him as a sort of hero.\n\nWhen he died at the age of the Florentines gave him a state funeral and had a picture painted which was dedicated to the memory of the most valiant soldier and most notable leader, Signor Giovanni Haukodue'."},{"id":"book-3-lesson-15","bookNumber":3,"number":15,"title":"Fifty pence worth of trouble","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-015-fifty-pence-worth-of-trouble-45223718/","text":"Lesson 15. Fifty pence worth of trouble.\n\nListen to the tape, then answer the question below.\n\nDid George get anything for his fifty pence?\n\nWhat?\n\nChildren always appreciate small gifts of money.\n\nMum or dad, of course, provides a regular supply of pocket money, But uncles and aunts are always a source of extra income.\n\nWith some children, small sums go a long way.\n\nIf fifty pence pieces are not exchanged for sweets, they rattle for months inside money boxes.\n\nOnly very thrifty children manage to fill up a money box.\n\nFor most of them, fifty pence is a small price to pay for a nice big bar of chocolate.\n\nMy nephew George has a money box, but it is always empty.\n\nVery few of the fifty pence pieces and pound coins I have given him have found their way there.\n\nI gave him fifty pence yesterday and advised him to save it.\n\nInstead, he bought himself fifty pence worth of trouble.\n\nOn his way to the sweet shop, he dropped his fifty pence and it bounced along the pavement and then disappeared down a drain.\n\nGeorge took off his jacket, rolled up his sleeves, and pushed his right arm through the drain cover.\n\nHe could not find his 50 pence piece anywhere, And what is more, he could not get his arm out.\n\nA crowd of people gathered round him and a lady rubbed his arm with soap and butter, but George was firmly stuck. fire brigade was called and two fire fighters freed George using a special type of grease.\n\nGeorge was not too upset by his experience, because the lady who owns the sweet shop heard about his troubles and rewarded him with a large box of chocolates."},{"id":"book-3-lesson-16","bookNumber":3,"number":16,"title":"Mary had a little lamb","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-016-mary-had-a-little-lamb-45223720/","text":"Lesson 16. Mary had a little lamb.\n\nListen to the tape, then answer the question below.\n\nWas Dimitri right to apologize to his neighbour?\n\nWhy not?\n\nMary and her husband Dimitri lived in the tiny village of Perachora in southern Greece.\n\nOne of Mary's prize possessions was a little white lamb which her husband had given her.\n\nShe kept it tied to a tree in a field during the day and went to fetch it every evening.\n\nOne evening, however, the lamb was missing.\n\nThe rope had been cut, so it was obvious that the lamb had been stolen.\n\nWhen Dimitri came in from the fields, his wife told him what had happened.\n\nDimitri at once set out to find the thief.\n\nHe knew it would not prove difficult in such a small village.\n\nAfter telling several of his friends about the theft, Dimitri found out that his neighbour, Aleko, had suddenly acquired a new lamb.\n\nDimitri immediately went to Aleko's house and angrily accused him of stealing the lamb.\n\nHe told him he had better return it or he would call the police.\n\nAleko denied taking it and led Dimitri into his backyard.\n\nIt was true that he had just bought a lamb, he explained.\n\nBut his lamb was black.\n\nAshamed of having acted so rashly, Dimitri apologized to Aleko for having accused him.\n\nWhile they were talking, it began to rain, and Dimitri stayed in Aleko's house until the rain stopped.\n\nWhen he went outside half an hour later, he was astonished to find that the little black lamb was almost white.\n\nIts wool, which had been dyed black, had been washed clean by the rain."},{"id":"book-3-lesson-17","bookNumber":3,"number":17,"title":"The longest suspension bridge in the world","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-017-the-longest-suspension-bridge-45223721/","text":"Lesson 17. The longest suspension bridge in the world.\n\nListen to the tape, then answer the question below.\n\nHow is the bridge supported?\n\nVerrazano, an Italian about whom little is known, sailed into New York Harbour in 1524 and named it Angouleme.\n\nHe described it as a very agreeable situation located within two small hills in the midst of which flowed a great river.\n\nThough Verrazano is by no means considered to be a great explorer, his name will probably remain immortal, for on November 21st, 1964, the longest suspension bridge in the world was named after him.\n\nThe Verrazano Bridge, which was designed by Othmar Ammann, joins Brooklyn to Staten Island.\n\nIt has a span of 4,260 feet.\n\nThe bridge is so long that the shape of the earth had to be taken into account by its designer.\n\nTwo great towers support four huge cables.\n\nThe towers are built on immense underwater platforms made of steel and concrete.\n\nThe platforms extend to a depth of over 100 feet under the sea.\n\nThese alone took sixteen months to build.\n\nAbove the surface of the water, the towers rise to a height of nearly 700 feet.\n\nThey support the cables from which the bridge has been suspended.\n\nEach of the four cables contains 26,108 lengths of wire.\n\nIt has been estimated that if the bridge were packed with cars, it would still only be carrying a third of its total capacity.\n\nHowever, size and strength are not the only important things about this bridge.\n\nDespite its immensity, it is both simple and elegant, fulfilling its designer's dream to creat an enormous object drawn as faintly as possible."},{"id":"book-3-lesson-18","bookNumber":3,"number":18,"title":"Electric currents in modern art","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-018-electric-currents-in-modern-ar-45223722/","text":"Lesson 18. Electric currents in modern art.\n\nListen to the tape, then answer the question below.\n\nHow might some of the exhibits have been dangerous?\n\nModern sculpture rarely surprises us any more.\n\nThe idea that modern art can only be seen in museums is mistaken.\n\nEven people who take no interest in art cannot have failed to notice examples of modern sculpture on display in public places.\n\nStrange forms stand in gardens and outside buildings and shops.\n\nWe have got quite used to them.\n\nSome so-called 'modern' pieces have been on display for nearly eighty years.\n\nIn spite of this, some people--including myself--were surprised by a recent exhibition of modern sculpture.\n\nThe first thing I saw when I entered the art gallery was a notice which said, Do not touch the exhibits.\n\nSome of them are dangerous.\n\nThe objects on display were pieces of moving sculpture.\n\nOddly shaped forms that are suspended from the ceiling and move in response to a gust of wind are quite familiar to everybody.\n\nThese objects, however, were different.\n\nLined up against the wall, there were long, thin wires attached to metal spheres.\n\nThe spheres had been magnetized and attracted or repelled each other all the time.\n\nIn the centre of the hall, there were a number of tall structures which contained coloured lights.\n\nThese lights flickered continuously like traffic lights, which have gone mad.\n\nSparks were emitted from small black boxes and red lamps flashed on and off angrily.\n\nIt was rather like an exhibition of prehistoric electronic equipment.\n\nThese peculiar forms not only seemed designed to shock people emotionally, but to give them electric shocks as well."},{"id":"book-3-lesson-19","bookNumber":3,"number":19,"title":"A very dear cat","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-019-a-very-dear-cat-45223723/","text":"Lesson 19. A very dear cat.\n\nListen to the tape, then answer the question below.\n\nWhy was Rastus very dear in more ways than one?\n\nKidnappers are rarely interested in animals, but they recently took considerable interest in Mrs. Eleanor Ramsay's cat.\n\nMrs. Eleanor Ramsay, a very wealthy old lady, has shared a flat with her cat, Rastus, for a great many years.\n\nRastus leads an orderly life.\n\nHe usually takes a short walk in the evenings and is always home by seven o'clock.\n\nOne evening, however, he failed to arrive.\n\nMrs. Ramsay got very worried.\n\nShe looked everywhere for him, but could not find him.\n\nThree days after Rastus' disappearance, Mrs. Ramsay received an anonymous letter.\n\nThe writer stated that Rastus was in safe hands and would be returned immediately if Mrs. Ramsay paid a ransom of 1, 000.\n\nMrs.Ramsay was instructed to place the money in a cardboard box and to leave it outside her door.\n\nAt first, she decided to go to the police, but fearing that she would never see Rastus again--the letter had made that quite clear--she changed her mind.\n\nShe withdrew 1000 from her bank and followed the kidnapper's instructions.\n\nThe next morning, the box had disappeared, but Mrs.Ramsay was sure that the kidnapper would keep his word.\n\nSure enough, Rastus arrived punctually at seven o'clock that evening.\n\nHe looked very well, though he was rather thirsty, for he drank half a bottle of milk.\n\nThe police were astounded when Mrs. Ramsay told them what she had done.\n\nShe explained that Rastus was very dear to her.\n\nConsidering the amount she paid, he was dear in more ways than one."},{"id":"book-3-lesson-20","bookNumber":3,"number":20,"title":"Pioneer pilots","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-020-pioneer-pilots-45223724/","text":"Lesson 20. Pioneer pilots.\n\nListen to the tape, then answer the question below.\n\nWhat was the name of the first plane to fly across the English Channel?\n\nIn 1908, Lord Northcliffe offered a prize of £1,000 to the first man who would fly across the English Channel.\n\nOver a year passed before the first attempt was made.\n\nOn July 19th, 1909, in the early morning, Hubert Latham took off from the French coast in his plane the 'Antoinette IV.'\n\nHe had travelled only seven miles across the Channel when his engine failed and he was forced to land on the sea.\n\nThe Antoinette floated on the water until Latham was picked up by a ship.\n\nTwo days later, Louis Bleriot arrived near Calais with a plane called 'No.XI'.\n\nBleriot had been making planes since 1905 and this was his latest model.\n\nA week before, he had completed a successful overland flight during which he covered twenty-six miles.\n\nLatham, however, did not give up easily.\n\nHe, too, arrived near Calais on the same day with a new Antoinette.\n\nIt looked as if there would be an exciting race across the Channel.\n\nBoth planes were going to take off on July 25th, but Latham failed to get up early enough.\n\nAfter making a short test flight at 4.15 a.m., Bleriot set off half an hour later.\n\nHis great flight lasted thirty-seven minutes.\n\nWhen he landed near Dover, the first person to greet him was a local policeman.\n\nLatham made another attempt a week later and got within half a mile of Dover, but he was unlucky again.\n\nHis engine failed and he landed on the sea for the second time."},{"id":"book-3-lesson-21","bookNumber":3,"number":21,"title":"Daniel Mendoza","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-021-daniel-mendoza-45223725/","text":"Lesson 21. Daniel Mendoza.\n\nListen to the tape, then answer the question below.\n\nHow many unsuccessful attempts did Mendoza make before becoming champion of all England?\n\nBoxing matches were very popular in England two hundred years ago.\n\nIn those days, boxers fought with bare fists for prize money.\n\nBecause of this, they were known as 'prizefighters'.\n\nHowever, boxing was very crude, for there were no rules, and a prizefighter could be seriously injured or even killed during a match.\n\nOne of the most colourful figures in boxing history was Daniel Mendoza, who was born in 1764.\n\nThe use of gloves was not introduced until 1860, when the Marquis of Queensberry drew up the first set of rules.\n\nThough he was technically a prizefighter, Mendoza did much to change crude prizefighting into a sport, for he brought science to the game.\n\nIn his day, Mendoza enjoyed tremendous popularity.\n\nHe was adored by rich and poor alike.\n\nMendoza rose to fame swiftly after a boxing match when he was only fourteen years old.\n\nThis attracted the attention of Richard Humphries who was then the most eminent boxer in England.\n\nHe offered to train Mendoza, and his young pupil was quick to learn.\n\nIn fact, Mendoza soon became so successful that Humphries turned against him.\n\nThe two men quarrelled bitterly and it was clear that the argument could only be settled by a fight.\n\nA match was held at Stilton, where both men fought for an hour.\n\nThe public bet a great deal of money on Mendoza, but he was defeated.\n\nMendoza met Humphries in the ring on a later occasion and he lost for a second time.\n\nIt was not until his third match in 1790 that he finally beat Humphries and became champion of England.\n\nMeanwhile, he founded a highly successful academy, and even Lord Byron became one of his pupils.\n\nHe earned enormous sums of money, and was paid as much as £100 for a single appearance.\n\nDespite this, he was so extravagant that he was always in debt.\n\nAfter he was defeated by a boxer called Gentleman Jackson, he was quickly forgotten.\n\nHe was sent to prison for failing to pay his debts, and died in poverty in 1836."},{"id":"book-3-lesson-22","bookNumber":3,"number":22,"title":"By heart","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-022-by-heart-45223726/","text":"Lesson 22. By heart.\n\nListen to the tape, then answer the question below.\n\nWhich actor read the letter in the end? the aristocrat or the gaoler?\n\nSome plays are so successful that they run for years on end.\n\nIn many ways, this is unfortunate for the poor actors, who are required to go on repeating the same lines night after night.\n\nOne would expect them to know their parts by heart and never have cause to falter.\n\nYet this is not always the case.\n\nA famous actor in a highly successful play was once cast in the role of an aristocrat who had been imprisoned in the Bastille for twenty years.\n\nIn the last act, a gaoler would always come on to the stage with a letter which he would hand to the prisoner.\n\nEven though the noble was expected to read the letter at each performance, he always insisted that it should be written out in full.\n\nOne night, the gaoler decided to play a joke on his colleague to find out if, after so many performances, he had managed to learn the contents of the letter by heart.\n\nThe curtain went up on the final act of the play and revealed the aristocrat sitting alone behind bars in his dark cell.\n\nJust then, the gaoler appeared with the precious letter in his hands.\n\nHe entered the cell and presented the letter to the aristocrat, but the copy he gave him had not been written out in full as usual.\n\nIt was simply a blank sheet of paper.\n\nThe gaoler looked on eagerly, anxious to see if his fellow actor had at last learnt his lines.\n\nThe noble stared at the blank sheet of paper for a few seconds.\n\nThen, squinting his eyes, he said, The light is dim.\n\nRead the letter to me.\n\nAnd he promptly handed the sheet of paper to the gaoler.\n\nFinding that he could not remember a word of the letter either, the gaoler replied: The light is indeed dim, sire.\n\nI must get my glasses.\n\nWith this, he hurried off the stage.\n\nMuch to the aristocrat's amusement, the gaoler returned a few moments later with a pair of glasses and the usual copy of the letter, which he proceeded to read to the prisoner."},{"id":"book-3-lesson-23","bookNumber":3,"number":23,"title":"One man's meat is another man's poison","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-023-one-mans-meat-is-another-mans-45223727/","text":"Lesson 23. One man's meat is another man's poison.\n\nListen to the tape, then answer the question below.\n\nWhat was it about snails that made the writer collect them for his friend on that day in particular?\n\nPeople become quite illogical when they try to decide what can be eaten and what cannot be eaten.\n\nIf you lived in the Mediterranean, for instance, you would consider octopus a great delicacy.\n\nYou would not be able to understand why some people find it repulsive.\n\nOn the other hand, your stomach would turn at the idea of frying potatoes in animal fat, the normally accepted practice in many northern countries.\n\nThe sad truth is that most of us have been brought up to eat certain foods, and we stick to them all our lives.\n\nNo creature has received more praise and abuse than the common garden snail.\n\nCooked in wine, snails are a great luxury in various parts of the world.\n\nThere are countless people who, ever since their early years, have learned to associate snails with food.\n\nMy friend Robert lives in a country where snails are despised.\n\nAs his flat is in a large town, he has no garden of his own.\n\nFor years, he has been asking me to collect snails from my garden and take them to him.\n\nThe idea never appealed to me very much, but one day, after a heavy shower, I happened to be walking in my garden when I noticed a huge number of snails taking a stroll on some of my prize plants.\n\nActing on a sudden impulse, I collected several dozen, put them in a paper bag, and took them to Robert.\n\nRobert was delighted to see me and equally pleased with my little gift.\n\nI left the bag in the hall, and Robert and I went into the living room where we talked for a couple of hours.\n\nI had forgotten all about the snails when Robert suddenly said that I must stay to dinner.\n\nSnails would, of course, be the main dish.\n\nI did not fancy the idea, and I reluctantly followed Robert out of the room.\n\nTo our dismay, we saw that there were snails everywhere.\n\nThey had escaped from the paper bag and had taken complete possession of the hall.\n\nI have never been able to look at a snail since then."},{"id":"book-3-lesson-24","bookNumber":3,"number":24,"title":"A skeleton in the cupboard","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-024-a-skeleton-in-the-cupboard-45223728/","text":"Lesson 24. A skeleton in the cupboard.\n\nListen to the tape, then answer the question below.\n\nWho was Sebastian?\n\nWe often read in novels how a seemingly respectable person or family has some terrible secret which has been concealed from strangers for years.\n\nThe English language possesses a vivid saying to describe this sort of situation.\n\nThe terrible secret is called A Skeleton in the Cupboard.\n\nAt some dramatic moment in the story, the terrible secret becomes known and a reputation is ruined.\n\nThe reader's hair stands on end when he reads in the final pages of the novel that the heroine, a dear old lady who had always been so kind to everybody, had in her youth poisoned every one of her five husbands.\n\nIt is all very well for such things to occur in fiction.\n\nTo varying degrees, we all have secrets which we do not want even our closest friends to learn.\n\nBut few of us have skeletons in the cupboard.\n\nThe only person I know who has a skeleton in the cupboard is George Carlton, and he is very proud of the fact.\n\nGeorge studied medicine in his youth.\n\nInstead of becoming a doctor, however, he became a successful writer of detective stories.\n\nI once spent an uncomfortable weekend which I shall never forget at his house.\n\nGeorge showed me to the guestroom which, he said, was rarely used.\n\nHe told me to unpack my things and then come down to dinner.\n\nAfter I had stacked my shirts and underclothes in two empty drawers, I decided to hang one of the two suits I had brought with me in the cupboard.\n\nI opened the cupboard door and then stood in front of it petrified.\n\nA skeleton was dangling before my eyes.\n\nThe sudden movement of the door made it sway slightly, and it gave me the impression that it was about to leap out at me.\n\nDropping my suit, I dashed downstairs to tell George.\n\nThis was worse than a terrible secret.\n\nThis was a real skeleton.\n\nBut George was unsympathetic.\n\nOh, that, he said, with a smile, as if he were talking about an old friend.\n\nThat's Sebastian.\n\nYou forget that I was a medical student once upon a time."},{"id":"book-3-lesson-25","bookNumber":3,"number":25,"title":"The Cutty Sark","sourceUrl":"https://www.lingq.com/zh-cn/%E5%9C%A8%E7%BA%BF%E5%AD%A6%E4%B9%A0%E8%8B%B1%E8%AF%AD/courses/2784330/3-025-the-cutty-sark-45223729/","text":"Lesson 25. The Cutty Sark.\n\nListen to the tape, then answer the question below.\n\nWhat piece of bad luck prevented the Cutty Sark from winning the race?\n\nOne of the most famous sailing ships of the nineteenth century, the Cutty Sark, can still be seen at Greenwich.\n\nShe stands on dry land and is visited by thousands of people each year.\n\nShe serves as an impressive reminder of the great ships of the past.\n\nBefore they were replaced by steamships, sailing vessels like the Cutty Sark were used to carry tea from China and wool from Australia.\n\nThe Cutty Sark was one of the fastest sailing ships that has ever been built.\n\nThe only other ship to match her was the Thermopylae.\n\nBoth these ships set out from Shanghai on June 18th, 1872 on an exciting race to England.\n\nThis race, which went on for exactly four months, was the last of its kind.\n\nIt marked the end of the great tradition of ships with sails and the beginning of a new era.\n\nThe first of the two ships to reach Java after the race had begun was the Thermopylae, But on the Indian Ocean, the Cutty Sark took the lead.\n\nIt seemed certain that she would be the first ship home.\n\nBut during the race, she had a lot of bad luck.\n\nIn August, she was struck by a very heavy storm during which her rudder was torn away.\n\nThe Cutty Sark rolled from side to side and it became impossible to steer her.\n\nA temporary rudder was made on board from spare planks and it was fitted with great difficulty.\n\nThis greatly reduced the speed of the ship, for there was a danger that if she travelled too quickly, this rudder would be torn away as well.\n\nBecause of this, the Cutty Sark lost her lead.\n\nAfter crossing the Equator, the captain called in at a port to have a new rudder fitted, but by now the Thermopylae was over five hundred miles\n\nThough the new rudder was fitted at tremendous speed, it was impossible for the Cutty Sark to win.\n\nShe arrived in England a week after the Thermopylae.\n\nEven this was remarkable, considering that she had had so many delays.\n\nThere is no
